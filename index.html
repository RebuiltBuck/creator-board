document.addEventListener("pointercancel", e=>endDrag(e,true));
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.classList?.contains("kcard")){ openVideo(e.target.dataset.id, e.target.dataset.kcard); } });

function openVideo(gid, iid){ openStudio(gid, iid); }

/* ---------- video workspace: script, shots, packaging, details ---------- */
// Each video's workspace lives in the "scripts" table (one row per video), not in the board,
// so long scripts don't make every board save bigger.
const SHOT_KINDS = ["A-roll","Gameplay","B-roll","Screen","Graphic","Sound","Other"];
const scripts = {}, scriptMeta = {};
let studio = null, sdSaveTimer = null, sdConfirmDel = false;
const words = t => (String(t||"").match(/\S+/g)||[]).length;
const mmss = sec => { sec=Math.round(sec); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; };
function shortNum(n){ n=+n||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M"; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K"; return String(n); }
function okImg(u){ return /^data:image\/(jpeg|png|webp);base64,/.test(u||"") || /^https:\/\/i\d?\.ytimg\.com\//.test(u||"") || /^https:\/\/yt\d\.ggpht\.com\//.test(u||""); }

function defaultScript(it){
  return { v:1, wpm:150, done:false,
    sections:[{id:uid(),name:"Hook",text:""},{id:uid(),name:"Intro",text:""},{id:uid(),name:"Main",text:""},{id:uid(),name:"Outro",text:""}],
    shots:[], titles:[{id:uid(), text:it?.label||""}], pick:null, thumb:{img:"",concept:"",text:""} };
}
function demoScript(it){
  const d=defaultScript(it);
  d.sections[0].text="Day one. The door sealed shut behind me, and all I had was a crafting table and one torch.";
  d.sections[1].text="The rules are simple: I can't leave this room until I've built everything on this list. If I die, my friends get to keep my stuff.";
  d.sections[2].text="The first problem was light. One torch doesn't last long when you're digging through stone, so I went straight for coal.\n\nBy day ten I had a farm, a furnace room and a very angry chicken.";
  d.sections[3].text="If you want to see whether I made it out, the next part is already up. See you there.";
  d.shots=[{id:uid(),sec:d.sections[0].id,kind:"Gameplay",desc:"Door slamming shut, slow push-in on the crafting table",done:false},
    {id:uid(),sec:d.sections[1].id,kind:"Graphic",desc:"Rules list on screen, ticked off one at a time",done:false},
    {id:uid(),sec:d.sections[2].id,kind:"B-roll",desc:"Timelapse of the farm being built",done:true}];
  d.titles=[{id:uid(),text:"I Survived 100 Days Locked Inside My SMP Base"},{id:uid(),text:"I Can't Leave This Room Until I Beat Minecraft"}];
  d.pick=d.titles[0].id; d.thumb.concept="Me pressed against a glass door, sealed room behind me, torch light only."; d.thumb.text="DAY 1";
  return d;
}
function sdCur(){ if(!studio) return {}; const r=findItem(studio.gid, studio.iid); return { g:r.g, it:r.it, d:scripts[studio.iid] }; }
function scriptSec(d){ return words((d?.sections||[]).map(s=>s.text).join(" "))/(d?.wpm||150)*60; }
function pickedTitle(d, it){ const t=(d?.titles||[]).find(x=>x.id===d.pick) || (d?.titles||[]).find(x=>x.text.trim()); return (t?.text||"").trim() || it?.label || "Untitled"; }

async function loadScript(iid, it){
  if(scripts[iid]) return;
  scriptMeta[iid]={loading:true};
  if(demo || !sb || !me){ scripts[iid]= it?.label?.startsWith("Example: Video 1") ? demoScript(it) : defaultScript(it); scriptMeta[iid]={}; return; }
  const { data, error } = await sb.from("scripts").select("data").eq("video_id", iid).maybeSingle();
  if(error){ scriptMeta[iid]={err:/relation|does not exist|schema cache/i.test(error.message) ? "Script storage isn't set up yet (run 9-scripts.sql in Supabase). Changes here won't be saved." : "Couldn't load this video's script: "+error.message}; scripts[iid]=defaultScript(it); return; }
  scripts[iid]=Object.assign(defaultScript(it), data?.data||{});
  scriptMeta[iid]={};
}
function sdSave(){
  if(!studio) return; const iid=studio.iid, d=scripts[iid], {it}=sdCur();
  if(it){ const w=words(d.sections.map(s=>s.text).join(" ")); if(it.scriptWords!==w){ it.scriptWords=w; state.example=false; persist(); } }
  if(demo || !sb || !me || scriptMeta[iid]?.err) { sdStatus(demo?"Preview · changes aren't saved":""); return; }
  sdStatus("Saving…"); clearTimeout(sdSaveTimer);
  sdSaveTimer=setTimeout(async ()=>{
    const { error } = await sb.from("scripts").upsert({ user_id: me.id, video_id: iid, data: JSON.parse(JSON.stringify(scripts[iid])), updated_at: new Date().toISOString() });
    sdStatus(error ? "Couldn't save. Check your connection." : "Saved");
  }, 800);
}
function sdStatus(t){ if(studio) studio.status=t; const el=document.getElementById("sd-status"); if(el) el.textContent=t; }

async function openStudio(gid, iid, tab){
  const {it}=findItem(gid, iid); if(!it) return;
  closeSheet();
  studio={ gid, iid, tab: tab||"script", feed:"home", feedDark: document.documentElement.dataset.theme==="dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches), pos:1, ai:null, status:"" };
  sdConfirmDel=false; if(!chData.data) loadChannels();
  document.getElementById("app").hidden=true; document.getElementById("studio").hidden=false; window.scrollTo({top:0});
  renderStudio();
  await loadScript(iid, it);
  if(studio?.iid===iid) renderStudio();
}
function closeStudio(){
  if(!studio) return; studio=null; stopPrompter();
  document.getElementById("studio").hidden=true; document.getElementById("studio").innerHTML="";
  if(me||demo){ document.getElementById("app").hidden=false; render(); }
}

function renderStudio(){
  const el=document.getElementById("studio"); if(!studio){ el.innerHTML=""; return; }
  const {g,it,d}=sdCur(); if(!it){ closeStudio(); return; }
  const fin=it.stage>=g.stages.length, stageName=fin?"Finished":g.stages[it.stage];
  const tabs=[["script","Script"],["shots","Shots"],["package","Packaging"],["details","Details"]];
  let h=`<div class="sd-top"><button class="btn" data-a="sd-close">← Board</button>
    <div class="sd-head"><div class="un-kicker">${esc(g.title||"Pipeline")} · ${esc(stageName)}${it.due?` · due ${esc(new Date(it.due+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}))}`:""}</div>
    <h1>${esc(it.label||"Untitled")}</h1></div><span class="sd-status" id="sd-status">${esc(studio.status||"")}</span></div>
    <nav class="tabs sd-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="tab" data-a="sd-tab" data-v="${k}" aria-selected="${studio.tab===k}">${l}${k==="shots"&&d?.shots?.length?` <span class="sd-count">${d.shots.length}</span>`:""}</button>`).join("")}</nav>`;
  if(scriptMeta[studio.iid]?.err) h+=`<div class="banner">${esc(scriptMeta[studio.iid].err)}</div>`;
  if(!d) h+=`<div class="note">Loading…</div>`;
  else if(studio.tab==="script") h+=sdScriptTab(g,it,d);
  else if(studio.tab==="shots") h+=sdShotsTab(it,d);
  else if(studio.tab==="package") h+=sdPackageTab(it,d);
  else h+=sdDetailsTab(g,it);
  el.innerHTML=h;
  el.querySelectorAll("textarea.sec-text").forEach(autoGrow);
}
function autoGrow(t){ t.style.height="auto"; t.style.height=(t.scrollHeight+2)+"px"; }

/* script tab */
function sdScriptTab(g,it,d){
  const sec=scriptSec(d), w=words(d.sections.map(s=>s.text).join(" "));
  const ai=studio.ai;
  let h=`<div class="sd-grid"><div class="sd-main">
    <div class="sd-stats card"><div class="sd-stat"><b id="sd-words">${fmt(w)}</b><span>words</span></div>
      <div class="sd-stat"><b id="sd-run">${mmss(sec)}</b><span>est. length</span></div>
      <label class="sd-stat sd-wpm"><input id="sd-wpm" type="number" min="80" max="260" step="5" value="${d.wpm||150}" data-sf="wpm" aria-label="Speaking speed in words per minute"><span>words / min</span></label>
      <div class="sd-actions"><button class="btn" data-a="sd-prompter" ${w?"":"disabled"}>Teleprompter</button>
      <button class="btn ${d.done?"":"primary"}" data-a="sd-done">${d.done?"Script done ✓":"Mark script done"}</button></div></div>`;
  d.sections.forEach((s,i)=>{
    const ss=words(s.text)/(d.wpm||150)*60, isHook=i===0;
    h+=`<div class="sec-blk" data-sec="${s.id}"><div class="sb-head"><input class="sec-name" value="${esc(s.name)}" data-sf="sec-name" data-id="${s.id}" aria-label="Section name">
      <span class="sec-time" data-sectime="${s.id}">${mmss(ss)}</span>
      <button class="icon-btn" data-a="sd-sec-up" data-v="${i}" ${i===0?"disabled":""} title="Move up" aria-label="Move section up">↑</button>
      <button class="icon-btn" data-a="sd-sec-down" data-v="${i}" ${i===d.sections.length-1?"disabled":""} title="Move down" aria-label="Move section down">↓</button>
      <button class="icon-btn" data-a="sd-sec-del" data-v="${i}" ${d.sections.length<=1?"disabled":""} title="Remove section" aria-label="Remove section">✕</button></div>
      <textarea class="sec-text" data-sf="sec-text" data-id="${s.id}" placeholder="${isHook?"The first thing you say. Make them need to keep watching.":"Write it out, or just bullet the beats."}" aria-label="${esc(s.name)} text">${esc(s.text)}</textarea>
      <div class="sec-foot">${isHook?`<span class="sec-warn" data-hookwarn ${ss>15?"":"hidden"}>Hooks under about 15 seconds hold more viewers.</span>`:""}
        <span class="sec-tools">${isHook?`<button class="btn sm" data-a="sd-ai" data-v="hooks" data-id="${s.id}">✦ 3 hook ideas</button>`:""}
        <button class="btn sm ghost" data-a="sd-ai" data-v="tighten" data-id="${s.id}" ${s.text.trim()?"":"disabled"}>✦ Tighten</button></span></div>
      ${ai && ai.sec===s.id ? aiBox(ai) : ""}</div>`;
  });
  h+=`<button class="add-goal" data-a="sd-sec-add">+ Add section</button></div>`;
  // side panel
  const thumb=d.thumb?.img;
  h+=`<aside class="sd-side"><div class="card"><div class="un-kicker">Packaging</div>
      ${thumb?`<img class="sd-mini" src="${esc(thumb)}" alt="Thumbnail">`:""}
      <div class="sd-picked">${esc(pickedTitle(d,it))}</div>
      <button class="btn sm" data-a="sd-tab" data-v="package" style="align-self:flex-start">${thumb?"Edit packaging":"Add titles + thumbnail"}</button></div>`;
  if(it.source?.title){
    const sid=it.source.id, o=(ideas.scan?.outliers||[]).find(x=>x.id===sid);
    h+=`<div class="card"><div class="un-kicker">Inspired by</div>
      ${o&&okImg(o.thumb)?`<img class="sd-mini" src="${esc(o.thumb)}" alt="" referrerpolicy="no-referrer">`:""}
      <div class="sd-src">${sid&&/^[\w-]{6,20}$/.test(sid)?`<a href="https://www.youtube.com/watch?v=${esc(sid)}" target="_blank" rel="noopener">${esc(it.source.title)}</a>`:esc(it.source.title)}</div>
      ${o?`<div class="note">${shortNum(o.views)} views${o.score?` · ${times(o.score)} its channel's subscribers`:""}</div>`:""}</div>`;
  }
  h+=`<div class="card"><div class="un-kicker">Shots</div><div class="note">${d.shots.length?`${d.shots.filter(x=>x.done).length} of ${d.shots.length} done`:"No shot list yet."}</div>
      <button class="btn sm" data-a="sd-tab" data-v="shots" style="align-self:flex-start">Open shot list</button></div>
    <div class="card"><div class="un-kicker">Notes</div><textarea class="sd-notes" data-sf="det-notes" placeholder="Angle, references, reminders…" aria-label="Notes">${esc(it.notes||"")}</textarea></div></aside></div>`;
  return h;
}
function aiBox(ai){
  if(ai.busy) return `<div class="ai-box"><span class="note">✦ Thinking…</span></div>`;
  if(ai.err) return `<div class="ai-box"><span class="note err">${esc(ai.err)}</span><button class="btn sm ghost" data-a="sd-ai-close" style="align-self:flex-start">Close</button></div>`;
  if(ai.mode==="hooks") return `<div class="ai-box"><div class="un-kicker">Hook ideas</div>${ai.items.map((x,i)=>`<div class="ai-opt"><div><div class="ai-t">${esc(x.text)}</div>${x.why?`<div class="note">${esc(x.why)}</div>`:""}</div><button class="btn sm" data-a="sd-ai-use" data-v="${i}">Use</button></div>`).join("")}<button class="btn sm ghost" data-a="sd-ai-close" style="align-self:flex-start">Close</button></div>`;
  if(ai.mode==="tighten") return `<div class="ai-box"><div class="un-kicker">Tighter version · ${fmt(words(ai.text))} words</div><div class="ai-t" style="white-space:pre-wrap">${esc(ai.text)}</div>
    <div class="row" style="justify-content:flex-start"><button class="btn sm primary" data-a="sd-ai-use" data-v="0">Replace mine</button><button class="btn sm ghost" data-a="sd-ai-close">Keep mine</button></div></div>`;
  return "";
}

/* shots tab */
function sdShotsTab(it,d){
  const groups=[...d.sections.map(s=>({id:s.id,name:s.name})), {id:null,name:"General"}];
  const done=d.shots.filter(x=>x.done).length;
  let h=`<div class="sd-bar"><span class="meta">${d.shots.length?`${d.shots.length} shot${d.shots.length>1?"s":""} · ${done} done`:"Plan what to record and what the editor should add, section by section."}</span>
    <span class="toolbar"><button class="btn" data-a="sd-ai" data-v="shots" ${words(d.sections.map(s=>s.text).join(" "))?"":"disabled"}>✦ Suggest shots from script</button>
    <button class="btn" data-a="sd-copy-shots" ${d.shots.length?"":"disabled"}>Copy for editor</button></span></div>`;
  if(studio.ai?.mode==="shots"){ const ai=studio.ai; h+= ai.busy?`<div class="ai-box"><span class="note">✦ Reading your script…</span></div>` : ai.err?`<div class="ai-box"><span class="note err">${esc(ai.err)}</span><button class="btn sm ghost" data-a="sd-ai-close" style="align-self:flex-start">Close</button></div>`:""; }
  groups.forEach(gr=>{
    const list=d.shots.filter(x=>(x.sec||null)===gr.id || (gr.id===null && !d.sections.some(s=>s.id===x.sec)));
    if(gr.id===null && !list.length) return;
    h+=`<div class="shot-grp"><div class="shot-head"><h3>${esc(gr.name||"Section")}</h3><span class="meta">${list.length||""}</span></div>
      ${list.map(x=>`<div class="shot ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} data-sf="shot-done" data-id="${x.id}" aria-label="Done">
        <select data-sf="shot-kind" data-id="${x.id}" aria-label="Shot type">${SHOT_KINDS.map(k=>`<option ${x.kind===k?"selected":""}>${k}</option>`).join("")}</select>
        <input class="shot-desc" value="${esc(x.desc)}" data-sf="shot-desc" data-id="${x.id}" placeholder="What's in the shot?" aria-label="Shot description">
        <button class="icon-btn" data-a="sd-shot-del" data-id="${x.id}" title="Remove shot" aria-label="Remove shot">✕</button></div>`).join("")}
      <button class="btn sm ghost" data-a="sd-shot-add" data-id="${gr.id||""}" style="align-self:flex-start">+ Add shot</button></div>`;
  });
  return h;
}
function shotsText(it,d){
  const lines=[`Shot list: ${pickedTitle(d,it)}`, ""];
  const groups=[...d.sections.map(s=>({id:s.id,name:s.name})), {id:null,name:"General"}];
  groups.forEach(gr=>{ const list=d.shots.filter(x=>(x.sec||null)===gr.id || (gr.id===null && !d.sections.some(s=>s.id===x.sec))); if(!list.length) return;
    lines.push(gr.name.toUpperCase()); list.forEach(x=>lines.push(`[${x.done?"x":" "}] ${x.kind}: ${x.desc}`)); lines.push(""); });
  return lines.join("\n").trim();
}

/* packaging tab */
function sdPackageTab(it,d){
  let h=`<div class="sd-grid pk"><div class="sd-main">
    <div class="card"><div class="card-top"><h3>Title options</h3><button class="btn sm" data-a="sd-ai" data-v="titles">✦ Suggest titles</button></div>
      <div class="ttl-list">${d.titles.map(t=>{ const n=t.text.length;
        return `<div class="ttl"><input type="radio" name="sd-pick" ${pickedTitle(d,it)===t.text&&t.text?"checked":""} data-sf="title-pick" data-id="${t.id}" aria-label="Use this title">
          <input class="ttl-in" value="${esc(t.text)}" data-sf="title" data-id="${t.id}" maxlength="100" placeholder="Write a title" aria-label="Title option">
          <span class="ttl-n ${n>70?"bad":n>60?"warn":""}" data-tn="${t.id}">${n}</span>
          <button class="icon-btn" data-a="sd-title-del" data-id="${t.id}" title="Remove" aria-label="Remove title">✕</button></div>`; }).join("")}</div>
      ${studio.ai?.mode==="titles"?aiTitles(studio.ai):""}
      <div class="row"><button class="btn sm" data-a="sd-title-add" ${d.titles.length>=10?"disabled":""}>+ Add title</button><span class="hint">Pick one to preview. Over 60 characters can get cut off on phones.</span></div></div>
    <div class="card"><div class="card-top"><h3>Feed preview</h3>
      <div class="seg mini" role="group" aria-label="Where">${[["home","Home"],["search","Search"],["phone","Phone"]].map(([k,l])=>`<button data-a="sd-feed" data-v="${k}" aria-pressed="${studio.feed===k}">${l}</button>`).join("")}</div></div>
      ${feedHtml(it,d)}
      <div class="row"><span class="toolbar"><button class="btn sm" data-a="sd-feed-dark">${studio.feedDark?"Light":"Dark"} mode</button><button class="btn sm" data-a="sd-feed-move">Move mine</button><button class="btn sm ghost" data-a="sd-feed-find">Which one is mine?</button></span>
      <span class="hint">${(chData.data?.videos||[]).length||(ideas.scan?.outliers||[]).length?"Next to real videos from channels you watch and your last scan.":"Watch channels or run a scan in the Research tab to see real videos here."}</span></div></div></div>
    <aside class="sd-side"><div class="card"><h3>Thumbnail</h3>
      <div class="thumb-box">${d.thumb?.img?`<img src="${esc(d.thumb.img)}" alt="Your thumbnail">`:`<span class="note">No image yet</span>`}</div>
      <div class="toolbar"><label class="btn sm file-btn">${d.thumb?.img?"Replace image":"Upload image"}<input type="file" accept="image/*" data-sf="thumb-file" hidden></label>
        ${d.thumb?.img?`<button class="btn sm ghost" data-a="sd-thumb-del">Remove</button>`:""}</div>
      ${d.thumb?.img?`<div class="small-check"><div class="un-kicker">At phone size</div><img src="${esc(d.thumb.img)}" alt="" class="tiny"></div>`:""}
      <div class="field"><label for="sd-tc">Concept</label><textarea id="sd-tc" data-sf="thumb-concept" placeholder="Focal point, emotion, colors, what makes it pop">${esc(d.thumb?.concept||"")}</textarea></div>
      <div class="field"><label for="sd-tt">Text on the thumbnail</label><input id="sd-tt" data-sf="thumb-text" value="${esc(d.thumb?.text||"")}" placeholder="2–4 words, or none">
        <span class="hint" data-ttwarn ${words(d.thumb?.text)>4?"":"hidden"}>More than 4 words is hard to read at phone size.</span></div>
      <button class="btn sm" data-a="sd-copy-brief" style="align-self:flex-start">Copy brief for designer</button></div></aside></div>`;
  return h;
}
function aiTitles(ai){
  if(ai.busy) return `<div class="ai-box"><span class="note">✦ Thinking…</span></div>`;
  if(ai.err) return `<div class="ai-box"><span class="note err">${esc(ai.err)}</span><button class="btn sm ghost" data-a="sd-ai-close" style="align-self:flex-start">Close</button></div>`;
  return `<div class="ai-box"><div class="un-kicker">Suggestions</div>${ai.items.map((x,i)=>`<div class="ai-opt"><div><div class="ai-t">${esc(x.text)}</div>${x.why?`<div class="note">${esc(x.why)}</div>`:""}</div><button class="btn sm" data-a="sd-ai-use" data-v="${i}">Add</button></div>`).join("")}<button class="btn sm ghost" data-a="sd-ai-close" style="align-self:flex-start">Close</button></div>`;
}
function feedHtml(it,d){
  const sec=scriptSec(d), med=ideas.latest?.benchmarks?.medianViews;
  const mine={ mine:true, title:pickedTitle(d,it), thumb:d.thumb?.img||"", ch:state.channel?.title||"Your channel", av:state.channel?.thumbnail||"", meta:med?`${shortNum(med)} views · 1 day ago`:"1 day ago", len:sec>0?mmss(sec):"", ph:d.thumb?.text||"" };
  const watched=(chData.data?.videos||[]).filter(v=>chData.data.channels.some(c=>c.id===v.channelId && c.kind==="watch")).sort((a,b)=>(b.score||0)-(a.score||0))
    .map(v=>{ const c=chById(v.channelId)||{}; return { title:v.title, thumb:okImg(v.thumb)?v.thumb:"", ch:c.title||"", av:c.thumbnail||"", meta:`${shortNum(v.views)} views · ${ago(v.publishedAt)}`, len:v.seconds?dur(v.seconds):"" }; });
  const outs=[...watched, ...(ideas.scan?.outliers||[]).map(o=>({ title:o.title, thumb:okImg(o.thumb)?o.thumb:"", ch:o.channelTitle||"", av:"", meta:`${shortNum(o.views)} views · ${ago(o.publishedAt)}`, len:o.seconds?dur(o.seconds):"" }))];
  const n=studio.feed==="home"?6:studio.feed==="search"?4:3;
  const others=outs.slice(0,n-1); while(others.length<n-1) others.push({ empty:true });
  const pos=studio.pos % n; const list=[...others]; list.splice(pos,0,mine);
  let k=0; const hue=t=>{ let x=0; for(const ch of String(t)) x=(x*31+ch.charCodeAt(0))%360; return x; };
  const card=c=>{
    if(c.empty) return `<div class="yt-c"><div class="yt-th"></div><div class="yt-info"><span class="yt-av"></span><div class="yt-tx"><div class="yt-skel"></div><div class="yt-skel s"></div></div></div></div>`;
    return `<div class="yt-c ${c.mine?"me":""}"><div class="yt-th" ${!c.thumb&&!c.mine?`style="background:hsl(${hue(c.title)} 30% 45%)"`:""}>${c.thumb?`<img src="${esc(c.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:c.mine?`<span class="yt-ph">${esc(c.ph||"Your thumbnail")}</span>`:""}${c.len?`<span class="yt-len">${esc(c.len)}</span>`:""}</div>
      <div class="yt-info"><span class="yt-av">${c.av&&okImg(c.av)?`<img src="${esc(c.av)}" alt="" referrerpolicy="no-referrer">`:esc((c.ch||"?").trim().charAt(0).toUpperCase())}</span>
      <div class="yt-tx"><div class="yt-t">${esc(c.title)}</div><div class="yt-m">${esc(c.ch)}</div><div class="yt-m">${esc(c.meta)}</div></div></div></div>`;
  };
  return `<div class="yt-feed ${studio.feed} ${studio.feedDark?"dark":""}" id="yt-feed"><div class="yt-wrap">${list.map(card).join("")}</div></div>`;
}

/* details tab */
function sdDetailsTab(g,it){
  const fin=it.stage>=g.stages.length;
  return `<div class="card sd-details">

/* teleprompter */
let tp=null;
function openPrompter(){
  const {d}=sdCur(); if(!d) return;
  const body=d.sections.filter(s=>s.text.trim()).map(s=>`<div class="tp-sec">${esc(s.name)}</div><p>${esc(s.text).replace(/\n/g,"<br>")}</p>`).join("");
  const el=document.createElement("div"); el.id="prompter"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Teleprompter");
  el.innerHTML=`<div class="tp-bar"><button class="btn" data-tp="play">Play</button>
    <span class="tp-ctl">Speed <button class="btn sm" data-tp="slower" aria-label="Slower">−</button><b id="tp-speed">4</b><button class="btn sm" data-tp="faster" aria-label="Faster">+</button></span>
    <span class="tp-ctl">Size <button class="btn sm" data-tp="smaller" aria-label="Smaller text">−</button><button class="btn sm" data-tp="bigger" aria-label="Bigger text">+</button></span>
    <button class="btn sm" data-tp="mirror">Mirror</button><button class="btn sm" data-tp="close">Close</button></div>
    <div class="tp-scroll"><div class="tp-line"></div><div class="tp-text">${body}</div></div>`;
  document.body.appendChild(el); document.body.classList.add("no-scroll");
  tp={ el, scroll:el.querySelector(".tp-scroll"), speed:4, size:44, playing:false, last:0, raf:0, lock:null };
  tp.el.querySelector(".tp-text").style.fontSize=tp.size+"px";
}
function tpLoop(t){ if(!tp) return; if(tp.playing){ const dt=tp.last?Math.min(100,t-tp.last):0; tp.scroll.scrollTop+=tp.speed*14*dt/1000; } tp.last=t; tp.raf=requestAnimationFrame(tpLoop); }
async function tpToggle(){
  if(!tp) return; tp.playing=!tp.playing; tp.el.querySelector('[data-tp="play"]').textContent=tp.playing?"Pause":"Play";
  if(tp.playing){ tp.last=0; cancelAnimationFrame(tp.raf); tp.raf=requestAnimationFrame(tpLoop); try{ tp.lock=await navigator.wakeLock?.request("screen"); }catch(e){} }
  else { try{ tp.lock?.release(); }catch(e){} tp.lock=null; }
}
function stopPrompter(){ if(!tp) return; cancelAnimationFrame(tp.raf); try{ tp.lock?.release(); }catch(e){} tp.el.remove(); tp=null; document.body.classList.remove("no-scroll"); }
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-tp]"); if(!b || !tp) return;
  const a=b.dataset.tp;
  if(a==="play") tpToggle();
  if(a==="faster"||a==="slower"){ tp.speed=Math.max(1,Math.min(15,tp.speed+(a==="faster"?1:-1))); document.getElementById("tp-speed").textContent=tp.speed; }
  if(a==="bigger"||a==="smaller"){ tp.size=Math.max(24,Math.min(96,tp.size+(a==="bigger"?6:-6))); tp.el.querySelector(".tp-text").style.fontSize=tp.size+"px"; }
  if(a==="mirror") tp.el.classList.toggle("mirror");
  if(a==="close") stopPrompter();
});

/* reading thumbnails: shrink to 1280x720 cover, JPEG, so the saved copy stays small */
function readThumb(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error("That file isn't an image."));
    if(file.size>20*1024*1024) return rej(new Error("That image is over 20 MB."));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const W=1280,H=720,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
      const r=Math.max(W/img.width,H/img.height), w=img.width*r, h=img.height*r; x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
      URL.revokeObjectURL(url); let q=0.82, out=c.toDataURL("image/jpeg",q); while(out.length>260000 && q>0.5){ q-=0.08; out=c.toDataURL("image/jpeg",q); } res(out); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Couldn't read that image.")); };
    img.src=url;
  });
}
async function copyText(t, msg){
  try{ await navigator.clipboard.writeText(t); }catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
  toast(msg);
}

/* ---------- Up next ---------- */
function upNext(){
  const all=[];
  for(const g of pipelines()) for(const it of g.items) if(it.stage<g.stages.length) all.push({g,it});
  if(!all.length) return null;
  const dueVal=x=>x.it.due?new Date(x.it.due+"T00:00:00").getTime():Infinity;
  all.sort((a,b)=> dueVal(a)-dueVal(b) || (b.it.stage/b.g.stages.length)-(a.it.stage/a.g.stages.length));
  return all[0];
}

function resetNote(g){

  const end=periodEnds(g.reset), days=Math.round((end-new Date(dkey(new Date())+"T00:00:00"))/86400000);

/* ---------- daily schedule ---------- */
const toMin = t => { const [h,m]=String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
function fmtTime(min){ min=((min%1440)+1440)%1440; return new Date(2000,0,1,Math.floor(min/60),min%60).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function durMin(min){ const h=Math.floor(min/60), m=min%60; return h?(m?`${h}h ${m}m`:`${h}h`):`${m}m`; }
function blocksOn(g, dow){
  return (g.blocks||[]).filter(b=>(b.days?.length?b.days:[0,1,2,3,4,5,6]).includes(dow))
    .map(b=>{ const f=toMin(b.from), t=toMin(b.to); return {...b, f, e:t>f?t:t+1440}; }).sort((a,b)=>a.f-b.f);
}
function scheduleNow(g, now=new Date()){
  const m=now.getHours()*60+now.getMinutes(), dow=now.getDay(), today=blocksOn(g,dow);
  let cur=[...today].reverse().find(b=>b.f<=m && m<b.e) || null;
  if(!cur){ const y=blocksOn(g,(dow+6)%7).find(b=>b.e>1440 && m<b.e-1440); if(y) cur={...y, f:y.f-1440, e:y.e-1440, carried:true}; }
  let next=today.find(b=>b.f>m && b.id!==cur?.id) || null, nextDay=0;
  for(let k=1; !next && k<=7; k++){ const b=blocksOn(g,(dow+k)%7)[0]; if(b){ next=b; nextDay=k; } }
  return {m, dow, today, cur, next, nextDay};
}
function scheduleBody(g){
  if(!(g.blocks||[]).length) return `<div class="note">Tap Edit board, then ✎ on this box to add your day.</div>`;
  const s=scheduleNow(g);
  let h=`<div class="sch-now"><div class="un-kicker">Right now</div>`;
  if(s.cur){
    const pct=Math.max(0,Math.min(100,(s.m-s.cur.f)/(s.cur.e-s.cur.f)*100));
    h+=`<div class="sch-label">${esc(s.cur.label||"Untitled")}</div>
      <div class="sch-time">${fmtTime(s.cur.f)} – ${fmtTime(s.cur.e)} · ${durMin(s.cur.e-s.m)} left</div>
      <div class="track"><div class="fill" data-anim-w="${g.id}-sch" style="width:${pct}%"></div></div>`;
  } else h+=`<div class="sch-label free">${s.today.length?"Free time":"Day off"}</div>`;
  h+=`</div>`;
  if(s.next){
    const when=s.nextDay===0?"Next":s.nextDay===1?"Tomorrow":DAY_NAMES[(s.dow+s.nextDay)%7];
    h+=`<div class="sch-next">${when}: <b>${esc(s.next.label||"Untitled")}</b> at ${fmtTime(s.next.f)}</div>`;
  }
  if(s.today.length) h+=`<div class="sch-list">${s.today.map(b=>{
      const now=s.cur && !s.cur.carried && s.cur.id===b.id, past=!now && b.e<=s.m;
      return `<div class="sch-row ${now?"now":""} ${past?"past":""}" data-anim-c="${g.id}-${b.id}"><span class="t">${fmtTime(b.f)}</span><span class="l">${esc(b.label||"Untitled")}</span></div>`; }).join("")}</div>`;
  return h;
}

/* ---------- calendar ---------- */
const calOff={};
function calMap(g){
  const map={}, add=(k,e)=>{ (map[k]=map[k]||[]).push(e); };
  if(g.showPipeline!==false) for(const p of pipelines()) for(const it of p.items) if(it.due){
    const fin=it.stage>=p.stages.length;
    add(it.due,{kind:"vid", label:it.label||"Untitled", fin, gid:p.id, iid:it.id, stage:fin?"Finished":p.stages[it.stage]});
  }
  for(const e of (g.events||[])) if(e.date) add(e.date,{kind:"ev", label:e.label||"Event", id:e.id});
  for(const k in map) map[k].sort((a,b)=>(a.kind==="vid"?0:1)-(b.kind==="vid"?0:1));
  return map;
}
const calOffW={};
function weekStart(g){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()-n.getDay()+7*(calOffW[g.id]||0)); }
function calTitle(g){
  if(g.calView==="week"){ const a=weekStart(g), b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
    const f=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    return a.getMonth()===b.getMonth()?`${f(a)} – ${b.getDate()}`:`${f(a)} – ${f(b)}`; }
  const now=new Date(), b=new Date(now.getFullYear(), now.getMonth()+(calOff[g.id]||0), 1);
  return b.toLocaleDateString(undefined,{month:"long", year: b.getFullYear()===now.getFullYear()?undefined:"numeric"}); }
function calNav(g){

  return `<div class="cal-nav"><div class="seg mini" role="group" aria-label="Calendar view"><button data-a="cal-view" data-id="${g.id}" data-v="week" aria-pressed="${wk}">Week</button><button data-a="cal-view" data-id="${g.id}" data-v="month" aria-pressed="${!wk}">Month</button></div>
    ${off?`<button class="btn sm ghost" data-a="cal-today" data-id="${g.id}">Today</button>`:""}
    <button class="icon-btn" data-a="cal-prev" data-id="${g.id}" aria-label="Previous ${unit}">‹</button><span class="m">${esc(calTitle(g))}</span>
    <button class="icon-btn" data-a="cal-next" data-id="${g.id}" aria-label="Next ${unit}">›</button></div>`;
}
// One week: seven roomy days with every event written out.
function calWeekBody(g){
  const tk=dkey(new Date()), a=weekStart(g), map=calMap(g);
  let h=`<div class="cal-week">`;
  for(let i=0;i<7;i++){
    const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i), k=dkey(d), evs=map[k]||[];
    const lbl=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+(evs.length?`, ${evs.length} planned`:"");
    h+=`<button class="cal-day wk ${k===tk?"today":""} ${k<tk?"past":""}" data-a="cal-day" data-id="${g.id}" data-day="${k}" aria-label="${esc(lbl)}">
      <span class="wk-h"><span class="wk-dn">${DAY_NAMES[d.getDay()]}</span><span class="dn">${d.getDate()}</span></span>
      <span class="cal-evs">${evs.map(e=>`<span class="cal-ev ${e.kind} ${e.fin?"done":""}" data-cal="${g.id}" data-day="${k}" data-ev="${e.kind==="vid"?`vid:${e.gid}:${e.iid}`:`ev:${e.id}`}" title="Drag to another day">${esc(e.label)}${e.kind==="vid"&&!e.fin?`<em>${esc(e.stage)}</em>`:""}</span>`).join("")}</span></button>`;
  }

function calendarBody(g){
  if(g.calView==="week") return calWeekBody(g);
  const now=new Date(), tk=dkey(now), base=new Date(now.getFullYear(), now.getMonth()+(calOff[g.id]||0), 1);
  const mo=base.getMonth(), first=base.getDay(), len=new Date(base.getFullYear(), mo+1, 0).getDate(), weeks=Math.ceil((first+len)/7);
  const map=calMap(g);
  let h=`<div class="cal-grid">${DAY_NAMES.map(d=>`<div class="cal-dow">${d}</div>`).join("")}`;
  for(let i=0;i<weeks*7;i++){
    const d=new Date(base.getFullYear(), mo, 1-first+i), k=dkey(d), evs=map[k]||[];
    const lbl=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+(evs.length?`, ${evs.length} planned`:"");
    h+=`<button class="cal-day ${d.getMonth()!==mo?"out":""} ${k===tk?"today":""} ${k<tk?"past":""}" data-a="cal-day" data-id="${g.id}" data-day="${k}" aria-label="${esc(lbl)}">
      <span class="dn">${d.getDate()}</span>${evs.length?`<span class="cal-evs">${evs.slice(0,3).map(e=>`<span class="cal-ev ${e.kind} ${e.fin?"done":""}" data-cal="${g.id}" data-day="${k}" data-ev="${e.kind==="vid"?`vid:${e.gid}:${e.iid}`:`ev:${e.id}`}" title="Drag to another day">${esc(e.label)}</span>`).join("")}${evs.length>3?`<span class="cal-more">+${evs.length-3} more</span>`:""}</span>`:""}</button>`;
  }
  h+=`</div>`;
  const up=[]; Object.keys(map).filter(k=>k>=tk).sort().forEach(k=>map[k].forEach(e=>{ if(!e.fin) up.push({k,e}); }));
  if(up.length){
    const tmr=daysFromNow(1);
    h+=`<div class="cal-agenda"><div class="un-kicker">Coming up</div>${up.slice(0,5).map(({k,e})=>{
      const d=k===tk?"Today":k===tmr?"Tomorrow":new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      const act=e.kind==="vid"?`data-a="vid-open" data-id="${e.gid}" data-item="${e.iid}"`:`data-a="cal-day" data-id="${g.id}" data-day="${k}"`;
      return `<button class="cal-ag" ${act}><span class="d">${esc(d)}</span><span class="l">${esc(e.label)}</span>${e.kind==="vid"?`<span class="chip">${esc(e.stage)}</span>`:"<span></span>"}</button>`; }).join("")}</div>`;
  }
  return h;
}

/* Two-column layout. When a section has a daily schedule and no full-width boxes,
   the schedule takes one column and up to three boxes stack beside it. */
function layoutClasses(goals){
  const out={}, sch=goals.find(g=>g.type==="schedule"); if(!sch) return out;
  const isWide=g=>g.type==="pipeline"||g.type==="calendar";
  const others=goals.filter(g=>g!==sch), k=Math.min(3, others.length);
  if(k>=2 && !goals.some(isWide)){
    const sc=goals[0]===sch?1:2, oc=3-sc;
    out[sch.id]={cls:"pin", style:`--c:${sc};--r:1 / span ${k}`};
    others.slice(0,k).forEach((g,i)=>out[g.id]={cls:"pin", style:`--c:${oc};--r:${i+1}`});
    return out;
  }
  // Otherwise the schedule sits in a normal row; keep the box beside it from stretching to its height.
  let row=0, col=0; const at={};
  for(const g of goals){
    if(isWide(g)){ if(col) row++; at[g.id]=row; row++; col=0; continue; }
    at[g.id]=row; col++; if(col>1){ col=0; row++; }
  }
  for(const g of others) if(!isWide(g) && at[g.id]===at[sch.id]) out[g.id]={cls:"short"};
  return out;
}
function card(g, gi, n, lay){
  const wide = g.type==="pipeline" || g.type==="calendar";
  let tools = editing ? `<div class="edit-tools">
    <button class="icon-btn" title="Move up" data-a="g-up" data-id="${g.id}" ${gi===0?"disabled":""}>↑</button>
    <button class="icon-btn" title="Move down" data-a="g-down" data-id="${g.id}" ${gi===n-1?"disabled":""}>↓</button>
    <button class="icon-btn" title="Edit" data-a="edit-goal" data-id="${g.id}">✎</button></div>`
    : (g.type==="pipeline" ? viewToggle(g) : g.type==="calendar" ? calNav(g)
      : g.type==="schedule" ? `<span class="clock">${fmtTime(new Date().getHours()*60+new Date().getMinutes())}</span>`
      : `<span class="kind">${TYPES[g.type]?.name||""}</span>`);
  let body="";
  if(g.type==="bar"){
    if(g.autoCount){ const n=autoCount(g); if(n!=null) g.done=n; }
    const pct=g.total>0?Math.min(100,(g.done/g.total)*100):0;
    body=`<div class="row bar-top"><div class="figure">${g.autoCount?`<span class="big" data-num="${g.id}-v">${fmt(g.done)}</span>`:`<button class="big big-edit" data-a="inline-num" data-id="${g.id}" data-field="done" data-num="${g.id}-v" aria-label="Edit ${esc(g.title)} value">${fmt(g.done)}</button>`}<span class="of">/ ${fmt(g.total)} ${esc(g.unit||"")}</span></div>
      ${g.autoCount?"":`<span class="step"><button data-a="dec" data-id="${g.id}" aria-label="Subtract one">−</button><button data-a="inc" data-id="${g.id}" aria-label="Add one">+</button></span>`}</div>
      <div class="track"><div class="fill" data-anim-w="${g.id}" style="width:${pct}%"></div></div>`;
  } else if(g.type==="gauge"){
    const steps=[...(g.steps||[])].sort((a,b)=>a-b);
    const next=steps.find(s=>s>g.value); const prev=[...steps].reverse().find(s=>s<=g.value)||0;
    const pct=next?Math.min(100,((g.value-prev)/(next-prev))*100):100;
    const numBtn=`<button class="big big-edit" data-a="inline-num" data-id="${g.id}" data-field="value" data-num="${g.id}-v" aria-label="Edit ${esc(g.title)} value">${esc(g.prefix||"")}${fmt(g.value)}</button>`;
    body = g.style==="arc"
      ? `<div class="arc g-arc">${arcSvg(pct/100, g.id)}<div class="arc-in">${numBtn}<div class="arc-k">${esc(g.unit||"")}</div></div></div>`
      : `<div class="figure">${numBtn}<span class="of">${esc(g.unit||"")}</span></div>
      <div class="track"><div class="fill" data-anim-w="${g.id}" style="width:${pct}%"></div></div>`;
    body+=`
      <div class="meta">${next?`${esc(g.prefix||"")}${fmt(next-g.value)} to the next milestone`:"Every milestone reached"}</div>
      <div class="ticks">${steps.map(s=>`<span class="tick ${s<=g.value?"hit":s===next?"next":""}" data-anim-c="${g.id}-t${s}">${esc(g.prefix||"")}${fmt(s)}</span>`).join("")}</div>`;
  } else if(g.type==="habit"){
    const today=new Date(), tk=dkey(today), days=g.days?.length?g.days:[0,1,2,3,4,5,6];
    const done=new Set(habitDates(g)), scheduled=days.includes(today.getDay()), doneToday=done.has(tk), st=liveStreak(g);
    const start=new Date(today); start.setDate(today.getDate()-today.getDay());
    const week=[...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
    const doneThisWeek=week.filter(d=>done.has(dkey(d))).length, goalThisWeek=days.length;
    body=`<div class="week">${week.map(d=>{ const k=dkey(d), fut=d>today&&k!==tk, isT=k===tk;
        return `<button class="${done.has(k)?"done":""} ${days.includes(d.getDay())?"":"off"} ${isT?"today":""}" data-a="check" data-id="${g.id}" data-day="${k}" data-anim-c="${g.id}-${k}" ${fut?"disabled":""} aria-pressed="${done.has(k)}" aria-label="${isT?"Today, ":""}${DAY_NAMES[d.getDay()]} ${d.getDate()}${done.has(k)?", done":""}"><span class="${isT?"tl":""}">${isT?"Today":DAYS[d.getDay()]}</span><span class="dn">${d.getDate()}</span></button>`;}).join("")}</div>
`;
  } else if(g.type==="pipeline"){
    body = pipelineList(g);   // the columns view (pipelineColumns) is kept in the code but no longer offered
  } else if(g.type==="schedule"){
    body = scheduleBody(g);
  } else if(g.type==="calendar"){
    body = (editing?calNav(g):"") + calendarBody(g);
  }
  let complete=false;
  if(g.type==="bar") complete = g.total>0 && g.done>=g.total;
  else if(g.type==="gauge") complete = (g.steps||[]).length>0 && (g.steps||[]).every(x=>x<=g.value);
  else if(g.type==="habit") complete = habitDates(g).includes(dkey(new Date()));
  else if(g.type==="pipeline") complete = g.items.length>0 && g.items.every(i=>i.stage>=g.stages.length);
  return `<div class="card t-${g.type} ${wide?"wide":""} ${lay?.cls||""} ${complete?"complete":""}" ${lay?.style?`style="${lay.style}"`:""} data-card="${g.id}" data-anim-c="card-${g.id}"><div class="card-top"><h3>${esc(g.title||"Untitled")}</h3>${tools}</div>${body}</div>`;
}

      <div class="field"><span class="lab">Items</span>${g.items.map((it,i)=>`<div class="item-edit"><input id="it-l-${it.id}" data-it="${i}" value="${esc(it.label)}" placeholder="Item name" aria-label="Item name">
        <select id="it-s-${it.id}" data-its="${i}" aria-label="Stage">${g.stages.map((s,si)=>`<option value="${si}" ${it.stage===si?"selected":""}>${esc(s)}</option>`).join("")}<option value="${g.stages.length}" ${it.stage>=g.stages.length?"selected":""}>Finished</option></select>
        <button class="icon-btn" data-a="it-del" data-v="${i}" title="Remove item">✕</button></div>`).join("")}
        <button class="btn sm" data-a="it-add" style="align-self:flex-start">+ Add item</button></div>`;
    h+=`<div class="sheet-foot">${draft._new?"":`<button class="btn ${confirmDel?"danger":"ghost"}" data-a="g-del">${confirmDel?"Tap again to delete":"Delete box"}</button>`}
      <div class="right"><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="save-goal">${draft._new?"Add box":"Save"}</button></div></div>`;
  }
  const wasOpen=!!root.querySelector(".scrim:not(.closing)");

  const first=root.querySelector("input,button.type-opt"); if(first && sheet!=="settings") first.focus({preventScroll:true});
}

function readGoalForm(){
  const v=id=>document.getElementById(id)?.value;
  const g=draft; g.title=(v("g-title")||"").trim()||"Untitled";
  if(g.type==="bar"){ const au=document.getElementById("g-auto"); if(au){ if(au.value) g.autoCount=au.value; else delete g.autoCount; }
    if(!g.autoCount) g.done=Math.max(0,+v("g-done")||0); else g.done=g.done||0; g.total=Math.max(0,+v("g-total")||0); g.unit=v("g-unit")||"";
    const r=v("g-reset")||"none"; if(r!==(g.reset||"none")){ g.reset=r; g.period=periodKey(r); delete g.last; } }
  if(g.type==="gauge"){ delete g.auto; g.style=document.getElementById("g-arc")?.checked?"arc":"bar";
    g.value=+v("g-value")||0; g.prefix=v("g-prefix")||""; g.unit=v("g-unit")||"";
    const pend=+(v("g-newstep")||0); if(pend>0 && !g.steps.includes(pend)) g.steps.push(pend);
    g.steps.sort((a,b)=>a-b); }
  if(g.type==="schedule") (g.blocks||[]).forEach((b,i)=>{ const l=document.getElementById("b-l-"+i); if(!l) return;
    b.label=l.value; b.from=v("b-f-"+i)||b.from; b.to=v("b-t-"+i)||b.to; });
  if(g.type==="calendar"){ const c=document.getElementById("g-calpipe"); if(c) g.showPipeline=c.checked; }
  if(g.type==="pipeline"){
    g.stages=g.stages.map((st,i)=>{ const el=document.getElementById("st-"+i); return el?el.value:st; });
    g.items.forEach(it=>{ const l=document.getElementById("it-l-"+it.id), s=document.getElementById("it-s-"+it.id);
      if(l) it.label=l.value; if(s) it.stage=Math.min(+s.value, g.stages.length); });
  }
}

function stageOp(op, i){
  readGoalForm(); const g=draft, n=g.stages.length;
  if(op==="add"){ const at=i==null?n:i+1; g.stages.splice(at,0,""); g.items.forEach(it=>{ if(it.stage>=at) it.stage++; });
    renderSheet(); document.getElementById("st-"+at)?.focus(); return; }
  if(op==="del"){ if(n<=1) return; g.stages.splice(i,1);
    g.items.forEach(it=>{ if(it.stage>i) it.stage--; else if(it.stage===i && i>=n-1) it.stage=n-2; }); renderSheet(); return; }
  const j=op==="up"?i-1:i+1; if(j<0||j>=n) return;
  [g.stages[i],g.stages[j]]=[g.stages[j],g.stages[i]];
  g.items.forEach(it=>{ if(it.stage===i) it.stage=j; else if(it.stage===j) it.stage=i; });
  renderSheet(); document.getElementById("st-"+j)?.focus();
}
function readCalDay(){ if(!draft?.events) return; draft.events.forEach((e,i)=>{ const el=document.getElementById("ev-"+i), d=document.getElementById("evd-"+i); if(el) e.label=el.value; if(d && d.value) e.date=d.value; }); }
function calSave(){
  readCalDay(); const pend=(document.getElementById("ev-new")?.value||"").trim();
  if(pend) draft.events.push({id:uid(), date:draft.date, label:pend.slice(0,80)});
  const g=findGoal(draft.gid)?.goal; if(!g) return;
  g.events=(g.events||[]).filter(e=>e.date!==draft.date).concat(draft.events.filter(e=>(e.label||"").trim()).map(e=>({...e,label:e.label.trim().slice(0,80)})));
  state.example=false; persist();
}
function nextSuggestion(steps){
  const s=[...(steps||[])].sort((a,b)=>a-b); if(!s.length) return 100;
  const last=s[s.length-1], raw=last*2, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  return Math.round(raw/mag*2)/2*mag;
}
function ytgAdd(){
  const el=document.getElementById("ytg-new"), typed=+(el?.value||0);
  const n=typed>0?typed:ytSuggest(draft.metric, draft.steps);
  if(!draft.steps.includes(n)) draft.steps.push(n); draft.steps.sort((a,b)=>a-b);
  renderSheet(); document.getElementById("ytg-new")?.focus();
}
function keepArcChoice(){ const c=document.getElementById("g-arc"); if(c && draft) draft.style=c.checked?"arc":"bar"; }
function addMilestone(){
  const el=document.getElementById("g-newstep"); const typed=+(el?.value||0);
  if(el) el.value=""; readGoalForm();
  const n=typed>0?typed:nextSuggestion(draft.steps);
  if(el) el.value="";
  if(!draft.steps.includes(n)) draft.steps.push(n); draft.steps.sort((a,b)=>a-b);
  renderSheet(); document.getElementById("g-newstep")?.focus();
}
function startInline(btn){
  const g=findGoal(btn.dataset.id)?.goal, field=btn.dataset.field; if(!g) return;
  const inp=document.createElement("input");
  inp.type="number"; inp.inputMode="decimal"; inp.className="big-input"; inp.id="inline-"+g.id; inp.value=g[field]??0;
  inp.setAttribute("aria-label","New value");
  btn.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const finish=save=>{ if(done) return; done=true;
    if(save){ const n=Number(inp.value); if(inp.value!=="" && isFinite(n)){ g[field]= field==="done"?Math.max(0,Math.round(n)):n; state.example=false; persist(); } }
    render(); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();finish(true);} if(e.key==="Escape"){e.preventDefault();finish(false);} });
  inp.addEventListener("blur",()=>finish(true));
}
function newGoal(type){
  const base={id:uid(), type, title:"", _new:true};
  if(type==="bar") return {...base, done:0, total:10, unit:"", reset:"none"};
  if(type==="gauge") return {...base, value:0, prefix:"", unit:"", steps:[100,500,1000]};
  if(type==="habit") return {...base, days:[0,1,2,3,4,5,6], doneDates:[]};
  if(type==="schedule") return {...base, title:"Daily schedule", blocks:defaultBlocks()};
  if(type==="calendar") return {...base, title:"Calendar", showPipeline:true, calView:"week", events:[]};
  return {...base, stages:["To do","Doing","Done"], items:[]};
}

  if(!handle){ msg.textContent="Type your @handle first."; input?.focus(); return; }
  readSettings();
  btn.disabled=true; msg.textContent="Looking up "+(handle.startsWith("@")?handle:"@"+handle)+"…";
  try{
    const r=await connectChannel(handle);
    draft.channel={ id:r.channel.id, handle:r.channel.handle, title:r.channel.title, thumbnail:r.channel.thumbnail };
    renderSheet();
    const m=document.getElementById("yt-msg"); if(m) m.textContent=`Found ${r.channel.title}. Tap Save to add it to your board.`;
  }catch(err){
    btn.disabled=false; msg.textContent=err.message||"Couldn't find that channel.";
  }
}
function previewTint(){ if(!draft) return; const keep=state.cardTint; state.cardTint=draft.cardTint; applyAccent(); state.cardTint=keep; }
function readSettings(){
  const v=id=>document.getElementById(id)?.value;
  if(!draft) return; const gl=document.getElementById("s-glow"); if(gl) draft.glow=gl.checked;
  const tc=document.getElementById("s-tint-color"), ts=document.getElementById("s-tint-str");
  if(draft.cardTint){ if(tc) draft.cardTint.color=tc.value; if(ts) draft.cardTint.strength=+ts.value; } draft.name=(v("s-name")||"").trim()||"My Board"; draft.countdown={label:v("s-cdl")||"", date:v("s-cdd")||""};
}
document.addEventListener("input", e=>{
  if(sheet==="settings" && (e.target.id==="s-tint-str" || e.target.id==="s-tint-color")){
    readSettings(); const v=document.getElementById("s-tint-val"); if(v) v.textContent=(draft.cardTint.strength||8)+"%"; previewTint();
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="g-auto" && sheet==="goal"){ readGoalForm(); if(draft.autoCount && (!draft.reset||draft.reset==="none")){ draft.reset="month"; } renderSheet(); return; }
  if(e.target.id==="un-idea"){ state.upnext={...unPrefs(), idea:e.target.checked}; commit(); return; }
  if(e.target.id==="io-days" || e.target.id==="io-shorts"){
    state.ideaOpts={ days:+document.getElementById("io-days").value, shorts:document.getElementById("io-shorts").checked }; persist();
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="s-custom"){ readSettings(); draft.accent=e.target.value; document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed","false")); }
  if(e.target.dataset.sec){ const s=state.sections.find(x=>x.id===e.target.dataset.sec); s.name=e.target.value; state.example=false; persist(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="g-newstep"){ e.preventDefault(); addMilestone(); return; }
  if(e.key==="Enter" && e.target.id==="ytg-new"){ e.preventDefault(); ytgAdd(); return; }
  if(e.key==="Enter" && /^st-\d+$/.test(e.target.id||"")){ e.preventDefault(); stageOp("add", +e.target.id.slice(3)); return; }
  if(e.key==="Enter" && e.target.id==="ev-new"){ e.preventDefault(); document.querySelector('[data-a="ev-add"]')?.click(); return; }
  if(e.key==="Enter" && e.target.id==="kw-new"){ e.preventDefault(); document.querySelector('[data-a="kw-add"]')?.click(); return; }
  if(e.key==="Enter" && e.target.id==="su-kw"){ e.preventDefault(); document.querySelector('[data-a="su-kw-add"]')?.click(); return; }
  if(e.key==="Enter" && e.target.id==="su-handle"){ e.preventDefault(); document.querySelector('[data-a="su-connect"]')?.click(); return; }
  if(e.key==="Escape" && sheet && sheet!=="setup") closeSheet();
  if((e.key==="e"||e.key==="E") && tab==="board" && !sheet && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")){ editing=!editing; render(); }
});

/* ---------- sign in ---------- */
let signUpMode=false, authMode="in";
// Shown on the Privacy & terms page. Add the email people can reach you at.
const CONTACT_EMAIL = "creatorboard.help@gmail.com";
function legalHtml(){
  const contact = CONTACT_EMAIL ? `<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>` : "[add your contact email]";
  return `<a href="#" data-legal-back style="align-self:flex-start">← Back</a>
  <h1>Privacy & terms</h1>
  <p class="note">Last updated October 6, 2026</p>
  <p>Creator Board is a goal board for YouTube creators. This page explains what it stores, how it uses YouTube data, and the rules for using it.</p>
  <h2>What we store</h2>
  <ul>
    <li><b>Your account:</b> your email address and a securely hashed password, handled by our database provider, Supabase.</li>
    <li><b>Your board:</b> the counters, habits, pipelines, schedules, calendar events, notes and links you add, plus each video's script, shot list, title options and thumbnail, and the list of channels you track. Only you can see your board and your list. The public stats of tracked channels and their videos (views, titles, thumbnails) are stored to show growth and changes over time.</li>
    <li><b>Your YouTube channel:</b> if you connect one, its handle and public statistics (subscribers, views and video count), saved once a day so you can see your growth.</li>
    <li><b>Idea scans:</b> the niche keywords you choose and the public videos found for them, saved for up to 14 days.</li>
  </ul>
  <h2>YouTube data</h2>
  <p>Creator Board uses YouTube API Services to read public channel and video information. We never ask for access to your YouTube account and cannot see private analytics. By using Creator Board you agree to be bound by the <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms of Service</a>. YouTube data is also covered by the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>.</p>
  <h2>AI-written ideas</h2>
  <p>When you tap an ✦ AI button in a video's workspace, that video's title and script are sent to Google's Gemini service to write the suggestion. Nothing is sent to Gemini unless you tap one of those buttons, and your email is never sent.</p>
  <h2>Who we share data with</h2>
  <p>Only the services that run Creator Board: Supabase (accounts and data), Netlify (hosting the site), YouTube API Services, and Google Gemini (AI writing help in the video workspace). We do not sell your data or show ads.</p>
  <h2>Deleting your data</h2>
  <p>You can clear your board anytime from Settings. To delete your account and everything in it, email ${contact} and it will be removed within 30 days.</p>
  <h2>Terms of use</h2>
  <ul>
    <li>Creator Board is provided as is, during an early beta. Features may change, and stats may be delayed or rounded by YouTube.</li>
    <li>Don't use it to break YouTube's rules, overload the service, or access other people's data.</li>
    <li>Accounts that abuse the service may be removed.</li>
  </ul>
  <h2>Contact</h2>
  <p>Questions: ${contact}</p>`;
}
function route(){
  const legal=location.hash==="#privacy", el=document.getElementById("legal");
  el.hidden=!legal;
  if(legal){ if(studio) closeStudio(); el.innerHTML=legalHtml(); document.getElementById("auth").hidden=true; document.getElementById("app").hidden=true; window.scrollTo({top:0}); }
  else { el.innerHTML=""; const on=!(me||demo); document.getElementById("auth").hidden=!on; document.getElementById("app").hidden=on; }
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e=>{ if(e.target.closest("[data-legal-back]")){ e.preventDefault(); try{ history.replaceState(null,"",location.pathname+location.search); }catch(err){ location.hash=""; } route(); } });
function showAuth(on){ if(on && studio) closeStudio(); if(on){ chData.data=null; chData.err=null; } if(location.hash==="#privacy"){ route(); return; } document.getElementById("auth").hidden=!on; document.getElementById("app").hidden=on; if(on) closeSheet(); }
// Modes: "in" sign in, "up" create account, "forgot" send a reset link, "newpass" choose a new password.
function setAuthMode(mode){
  if(mode===true) mode="up"; if(mode===false) mode="in";
  authMode=mode; signUpMode=mode==="up";
  const $=id=>document.getElementById(id);
  const copy={
    in:["Sign in to see your board.","Sign in"],
    up:["Create an account to save your board.","Create account"],
    forgot:["Enter your email and we'll send you a link to reset your password.","Send reset link"],
    newpass:["Choose a new password for your account.","Save new password"]
  }[mode];
  $("authLead").textContent=copy[0]; $("authBtn").textContent=copy[1];
  $("emailField").hidden = mode==="newpass";
  $("passField").hidden = mode==="forgot";
  $("pass2Field").hidden = !(mode==="up" || mode==="newpass");
  $("passHint").hidden = !(mode==="up" || mode==="newpass");
  $("passLabel").textContent = mode==="newpass" ? "New password" : "Password";
  $("authPass").autocomplete = mode==="in" ? "current-password" : "new-password";
  $("authPass").value=""; $("authPass2").value="";
  $("authSwitch").hidden = mode==="newpass";
  $("authSwitch").textContent = mode==="up" ? "Already have an account? Sign in" : mode==="forgot" ? "Back to sign in" : "New here? Create an account";
  $("authForgot").hidden = mode!=="in";
  const tr=document.querySelector(".auth .try"); if(tr) tr.hidden = mode==="newpass";
  $("authBtn").disabled=false;
  authMsg("");
}
function authMsg(t, err){ const m=document.getElementById("authMsg"); m.textContent=t; m.classList.toggle("err", !!err); }
function clearAuthHash(){ if(/access_token|type=recovery|error/.test(location.hash)){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} } }
document.getElementById("tryDemo").addEventListener("click", startDemo);
document.getElementById("authSwitch").addEventListener("click", ()=>setAuthMode(authMode==="in"?"up":"in"));
document.getElementById("authForgot").addEventListener("click", ()=>{ const em=document.getElementById("authEmail").value; setAuthMode("forgot"); document.getElementById("authEmail").value=em; document.getElementById("authEmail").focus(); });
document.getElementById("authForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=document.getElementById("authEmail").value.trim(), password=document.getElementById("authPass").value, password2=document.getElementById("authPass2").value;
  const btn=document.getElementById("authBtn");
  if(authMode==="forgot"){
    if(!/^\S+@\S+\.\S+$/.test(email)){ authMsg("Enter the email you signed up with.", true); return; }
    btn.disabled=true; authMsg("Sending…");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin+location.pathname });
    btn.disabled=false;
    if(error){ authMsg(error.message, true); return; }
    authMsg("If there's an account for that email, a reset link is on its way. Check your inbox and spam folder.");
    return;
  }
  if(authMode==="newpass" || authMode==="up"){
    if(authMode==="up" && !email){ authMsg("Enter your email.", true); return; }
    if(password.length<8){ authMsg("Use at least 8 characters for your password.", true); return; }
    if(password!==password2){ authMsg("The two passwords don't match.", true); document.getElementById("authPass2").focus(); return; }
  } else if(!email || !password){ authMsg("Enter your email and password.", true); return; }
  if(authMode==="newpass"){
    btn.disabled=true; authMsg("Saving…");
    const { error } = await sb.auth.updateUser({ password });
    btn.disabled=false;
    if(error){ authMsg(error.message, true); return; }
    recovering=false; clearAuthHash(); setAuthMode("in");
    showAuth(false); setTimeout(loadBoard,0); setTimeout(()=>toast("Password updated"),300);
    return;
  }
  btn.disabled=true; authMsg(signUpMode?"Creating your account…":"Signing in…");
  const { data, error } = signUpMode ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false;
  if(error){ authMsg(error.message, true); return; }
  if(signUpMode && !data.session) authMsg("Check your email to confirm your account, then sign in.");
});

async function start(){
  if(!sb){ showAuth(true); authMsg("Sign-in isn't available here. Use “Try it without an account” to preview.", true); return; }
  if(linkError){ clearAuthHash(); showAuth(true); setAuthMode("forgot"); authMsg(`That link didn't work (${linkError}). Send yourself a new one.`, true); }
  sb.auth.onAuthStateChange((event, session)=>{
    const u=session?.user||null;
    if(event==="PASSWORD_RECOVERY") recovering=true;
    if(u && recovering){ me=u; demo=false; showAuth(true); if(authMode!=="newpass") setAuthMode("newpass"); return; }
    if(u && (!me || me.id!==u.id)){ demo=false; me=u; showAuth(false); setTimeout(loadBoard,0); }
    else if(!demo && (!u && me!==null || (!u && event==="INITIAL_SESSION"))){ me=null; snaps=[]; showAuth(true); }
  });
}
start();
route();
// Refresh the date, countdown and today's habits after midnight.
let lastDay=dkey(new Date());
setInterval(()=>{ const k=dkey(new Date()); if(k!==lastDay && !sheet){ lastDay=k; applyResets(); render(); } }, 60000);
// Keep the daily schedule on the right block: re-draw once a minute while the board is on screen.
let lastMin=-1;
setInterval(()=>{
  const n=new Date(), m=n.getHours()*60+n.getMinutes(); if(m===lastMin) return; lastMin=m;
  if(sheet || drag || tab!=="board" || document.getElementById("app").hidden) return;
  const ae=document.activeElement; if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if(!state.sections.some(s=>s.goals.some(g=>g.type==="schedule"))) return;
  render();
}, 10000);
</script>

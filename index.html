<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Board</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creator Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)">
<script>
/* On the test address (preview--creatorboard.netlify.app) the Home Screen app is named "CB Test" and shows a small label, so it's easy to tell apart from the live site. */
(function(){
  if(!/^preview--/.test(location.hostname)) return;
  document.title = "CB Test";
  var t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(t) t.content = "CB Test";
  var m = document.querySelector('link[rel="manifest"]'); if(m) m.href = "/manifest-preview.webmanifest";
  document.addEventListener("DOMContentLoaded", function(){
    var b = document.createElement("div"); b.textContent = "Test version"; b.setAttribute("aria-hidden","true");
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(4px + env(safe-area-inset-top,0px));z-index:9999;background:#e5322d;color:#fff;font:600 11px/1 -apple-system,system-ui,sans-serif;padding:5px 8px;border-radius:99px;pointer-events:none;opacity:.92";
    document.body.appendChild(b);
  });
})();
</script>
<meta name="description" content="A simple goal board for YouTube creators, with your channel stats updated daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one quiet column of sections, cards in a 2-up grid that drops to 1-up on phones. Ink on paper, one optional accent. */
:root{
  --bg:#ffffff; --surface:#f6f6f5; --fg:#111111; --muted:#4f4f4f; --line:#e4e4e2; --line-strong:#cfcfcc;
  --accent-src:var(--fg); --accent:var(--accent-src); --on-accent:#ffffff;
  --good:#1f7a3f; --danger:#b42318;
  --font-ui:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-display:"Archivo","Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-num:"Archivo","Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#161616; --fg:#f2f2f2; --muted:#b4b4b4; --line:#262626; --line-strong:#3a3a3a;
  --on-accent:#0c0c0c; --good:#4fbf75; --danger:#f0786d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#161616; --fg:#f2f2f2; --muted:#b4b4b4; --line:#262626; --line-strong:#3a3a3a;
  --on-accent:#0c0c0c; --good:#4fbf75; --danger:#f0786d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:28px 96px;display:flex;flex-direction:column;gap:36px}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--fg)}
.title h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.title .date{color:var(--muted);margin-top:6px;font-size:14px}
.countdown{text-align:right}
.countdown .n{font-family:var(--font-num);font-size:clamp(26px,5vw,38px);font-weight:500;line-height:1;color:var(--accent);letter-spacing:-.02em}
.countdown .l{color:var(--muted);font-size:13px;margin-top:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .status{color:var(--muted);font-size:13px;margin-right:auto}
.btn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default;border-color:var(--line-strong)}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted)}

/* sections */
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:center;gap:10px;min-height:32px}
.sec-head h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-head input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line-strong);background:transparent;padding:4px 0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--bg)}
.card.wide{grid-column:1/-1}
.card.pin{grid-column:var(--c);grid-row:var(--r)}
.card.short{align-self:start}
.card:not(.wide):not(.t-schedule)>:last-child:not(.card-top){margin-top:auto}
@media (max-width:640px){.card.pin{grid-column:auto;grid-row:auto}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.card .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.edit-tools{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:14px;line-height:1;color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--fg)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;text-align:center}

/* bar */
.figure{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.figure .big{font-family:var(--font-num);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.figure .of{color:var(--muted);font-size:14px}
.big-edit{border:0;background:none;padding:2px 6px;margin:-2px -6px;border-radius:8px;text-align:left;cursor:text;border-bottom:1.5px dashed var(--line-strong);border-radius:6px 6px 0 0}
.big-edit:hover{background:var(--surface)}
.big-input{font-family:var(--font-num);font-size:30px;font-weight:500;line-height:1;width:7ch;max-width:100%;padding:2px 6px;margin:-2px -6px;border:1.5px solid var(--fg);border-radius:8px;background:var(--bg)}
.tap-hint{font-size:12px;color:var(--muted)}
.track{height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step{display:flex;gap:6px}
.step button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);font-size:18px;line-height:1}
.step button:hover{border-color:var(--fg)}
.meta{color:var(--muted);font-size:13px}
.meta.good{color:var(--accent);font-weight:600}

/* milestones */
.ticks{display:flex;flex-wrap:wrap;gap:6px}
.tick{font-family:var(--font-num);font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted)}
.tick.hit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tick.next{border-color:var(--fg);color:var(--fg)}

/* habit */
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--bg);padding:12px 14px}
.habit:hover{border-color:var(--fg)}
.habit .box{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--fg);display:grid;place-items:center;flex-shrink:0;font-size:15px;font-weight:700}
.habit.done .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.habit .lbl{flex:1;min-width:0;font-weight:500}
.habit.rest{opacity:.55;cursor:default}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%}
.week button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);font-size:11px;color:var(--fg);line-height:1.2}
.week button .dn{font-family:var(--font-num);font-size:13px}
.week button.off{border-style:dashed;color:var(--muted)}
.week button.done{background:var(--accent);border-color:var(--accent);border-style:solid;color:var(--on-accent)}
.week button.today{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--fg)}
.week button:disabled{opacity:.35;cursor:default}

/* pipeline */
.stages{display:flex;gap:4px}
.stages i{flex:1;height:6px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.stages i.on{background:var(--accent);border-color:var(--accent)}
.stages i.cur{background:color-mix(in srgb,var(--accent) 45%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .stage{color:var(--muted);font-size:13px}
.item .stages{grid-column:1/-1}
.item .acts{display:flex;gap:4px}
.item.finished .name{text-decoration:line-through;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:9px 11px;font-size:15px}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-opt{border:1px solid var(--line-strong);border-radius:var(--r);padding:12px;text-align:left;background:var(--bg)}
.type-opt b{display:block;font-weight:600}
.type-opt span{font-size:13px;color:var(--muted)}
.type-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:40px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ms-list{display:flex;flex-wrap:wrap;gap:6px}
.ms-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:99px;border:1px solid var(--line-strong);font-size:14px}
.ms-chip.hit{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.ms-chip button{width:24px;height:24px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:11px;line-height:1}
.ms-chip button:hover{color:var(--fg)}
.ms-add{display:flex;gap:8px}
.ms-add input{flex:1;min-width:0}
.item-edit{display:grid;grid-template-columns:minmax(0,1fr) 140px 34px;gap:6px}
.item-edit input,.item-edit select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:14px;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line-strong)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sw.mono{background:linear-gradient(135deg,#111 50%,#f2f2f2 50%)}
.custom-color{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.custom-color input{width:40px;height:34px;padding:0;border:1px solid var(--line-strong);border-radius:8px;background:none}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.sheet-foot .right{display:flex;gap:8px;margin-left:auto}
.add-goal{border:1px dashed var(--line-strong);border-radius:var(--r);background:transparent;padding:14px;color:var(--muted);font-weight:500;min-height:64px}
.add-goal:hover{color:var(--fg);border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* standalone site extras */
html,body{margin:0}
[hidden]{display:none!important}
.auth{max-width:380px;margin:0 auto;padding-inline:20px;padding-block:12vh 64px;display:flex;flex-direction:column;gap:18px}
.auth h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em}
.auth p{margin:0;color:var(--muted)}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .msg{font-size:14px;min-height:20px;color:var(--muted)}
.auth .msg.err{color:var(--danger)}
.auth .try{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-top:14px;border-top:1px solid var(--line)}
.demo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg));border-radius:var(--r);padding:10px 14px;font-size:14px}
.auth .links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.auth .switch{background:none;border:0;color:var(--fg);text-decoration:underline;padding:0;font-size:14px;align-self:flex-start}
.yt-card{display:flex;flex-direction:column;gap:14px}
.yt-head{display:flex;align-items:center;gap:12px;min-width:0}
.yt-head img{width:40px;height:40px;border-radius:50%;background:var(--surface);flex-shrink:0}
.yt-head .who{min-width:0}
.yt-head .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.yt-head .who span{color:var(--muted);font-size:13px}
.yt-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.yt-stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg);font:inherit;color:inherit;cursor:pointer;transition:border-color .3s ease,background-color .3s ease}
.yt-stat:hover{border-color:var(--fg)}
.yt-stat.complete{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.yt-stat .v{color:var(--fg)}
.yt-stat .k{display:flex;justify-content:space-between;gap:6px}
.yt-stat .k i{font-style:normal;color:var(--accent);letter-spacing:0;text-transform:none;font-size:11px}
.yt-stat .track{height:6px}
.yt-stat .goal{font-size:12px;color:var(--muted)}
.yt-stat .goal b{color:var(--accent);font-weight:600}
.yt-stat .set{font-size:12px;color:var(--accent);font-weight:600}
.yt-card{border-top:3px solid var(--accent)}
.arcs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 20px}
.arc{position:relative;flex:1 1 180px;max-width:260px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit}
.arc svg{width:100%;height:auto;display:block;overflow:visible}
.arc-track{fill:none;stroke:color-mix(in srgb,var(--fg) 10%,var(--bg));stroke-width:14;stroke-linecap:round}
.arc-fill{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.arc-in{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none}
.arc-v{font-family:var(--font-num);font-size:clamp(24px,6vw,32px);font-weight:500;line-height:1;letter-spacing:-.02em}
.arc-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.arc-u{font-size:13px;color:var(--muted)}
.arc-u b{color:var(--accent)}
.g-arc{align-self:center;width:100%;max-width:240px;cursor:default}
.g-arc .arc-in{pointer-events:auto;top:40%}
.g-arc .big{font-size:28px}
.card:has(.g-arc) .meta{text-align:center}
.card:has(.g-arc) .ticks{justify-content:center}
.yt-stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.yt-stat .v{font-family:var(--font-num);font-size:22px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.yt-stat .d{font-size:12px;color:var(--muted)}
.yt-stat .d.up{color:var(--good)}
.spark{width:100%;height:96px;display:block}
.spark .area{fill:var(--accent);opacity:.1}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.spark .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.spark-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--fg)}
.auto-note{font-size:12px;color:var(--muted)}
.yt-connect{display:flex;gap:8px}
.yt-connect input{flex:1;min-width:0}
@media (max-width:520px){.yt-stats{grid-template-columns:1fr 1fr}.yt-stats .yt-stat:last-child{grid-column:1/-1}}
/* completed cards: tinted with the accent */
.card{transition:border-color .3s ease,background-color .3s ease}
.card.complete{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.item{transition:border-color .3s ease,background-color .3s ease}
.item.finished{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.yt-stat .d.up{color:var(--accent)}
/* week row: today is the main control */
.week{gap:6px}
.week button{padding:8px 0;min-height:52px;justify-content:center;transition:background-color .25s ease,border-color .25s ease,color .25s ease,transform .15s ease}
.week button.today{box-shadow:none;border:2px solid var(--fg);font-weight:600}
.week button.today.done{border-color:var(--accent)}
.week button .tl{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.week button:not(:disabled):active{transform:scale(.94)}
.habit-hint{font-size:12px;color:var(--muted)}
/* motion */
.fill{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stages i,.tick{transition:background-color .3s ease,border-color .3s ease,color .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.bump{animation:bump .3s ease;display:inline-block}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-in{animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.scrim{animation:fadeIn .2s ease}
.scrim .sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.scrim.closing{animation:fadeIn .18s ease reverse forwards}
.scrim.closing .sheet{animation:sheetUp .18s ease reverse forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:-18px}
.tab{border:0;background:none;padding:10px 14px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s ease,border-color .2s ease}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
/* ideas page */
.ideas{display:flex;flex-direction:column;gap:36px}
.panel{display:flex;flex-direction:column;gap:14px}
.lv{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.lv{grid-template-columns:1fr}}
.thumb{width:100%;aspect-ratio:16/9;border-radius:8px;background:var(--surface);object-fit:cover;display:block;max-width:100%}
.lv h3{margin:0;font-size:17px;line-height:1.3}
.lv h3 a,.oi a{color:inherit;text-decoration:none}
.lv h3 a:hover,.oi a:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line-strong);color:var(--muted)}
.pill.up{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.kv .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-family:var(--font-num);font-size:18px;overflow-wrap:anywhere}
.kv .d{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:1fr 1fr}}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;position:relative;padding-top:4px}
.bars span{flex:1;background:color-mix(in srgb,var(--fg) 14%,var(--bg));border-radius:4px 4px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bars span.me{background:var(--accent)}
.bars .med{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.bars-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kw .ms-chip{font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:7px 9px}
.olist{display:flex;flex-direction:column;gap:10px}
.oi{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:10px}
@media (max-width:480px){.oi{grid-template-columns:104px minmax(0,1fr)}}
.oi b{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.oi .m{font-size:13px;color:var(--muted);margin-top:4px}
.oi .pill{margin-top:0}
.oi-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.idea{display:flex;flex-direction:column;gap:6px}
.idea .t{font-size:17px;font-weight:600;line-height:1.3}
.idea .hk{font-style:italic}
.idea .w,.idea .src{font-size:13px;color:var(--muted)}
.ideas-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.ideas-grid{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted)}
.loading{color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;animation:fadeIn .2s ease}
/* heavier type everywhere */
h1{font-weight:800!important}
.card h3,.lv h3,.oi b,.idea .t{font-weight:700}
.sec-head h2,.kind,.yt-stat .k,.kv .k,.arc-k,.field label,.field .lab{font-weight:700}
.btn,.tab{font-weight:600}
.figure .big,.arc-v,.yt-stat .v,.kv .v,.countdown .n,.big-input,.tick,.num{font-weight:600}
.meta,.note,.hint,.of,.stage,.d,.goal,.arc-u,.spark-meta,.bars-meta,.oi .m,.idea .w,.idea .src,.date,.status{font-weight:500}
/* neon glow (Board settings) */
:root.glow{--glow-a:color-mix(in srgb,var(--accent) 65%,transparent);--glow-b:color-mix(in srgb,var(--accent) 30%,transparent)}
:root.glow header{border-bottom-color:transparent;position:relative}
:root.glow header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--glow-a),0 0 18px var(--glow-b);pointer-events:none}
:root.glow .countdown .n,:root.glow h1{text-shadow:0 0 10px var(--glow-a),0 0 24px var(--glow-b)}
:root.glow .fill,:root.glow .stages i.on,:root.glow .week button.done,:root.glow .tick.hit,:root.glow .pill.up{box-shadow:0 0 8px var(--glow-a),0 0 18px var(--glow-b)}
:root.glow .arc-fill{filter:drop-shadow(0 0 5px var(--glow-a)) drop-shadow(0 0 12px var(--glow-b))}
:root.glow .spark .ln{filter:drop-shadow(0 0 4px var(--glow-a))}
:root.glow .card.complete,:root.glow .yt-stat.complete{box-shadow:0 0 0 1px var(--accent),0 0 22px -4px var(--glow-a)}
:root.glow .yt-card{box-shadow:0 -1px 14px -6px var(--glow-a)}
:root.glow .tab[aria-selected="true"]{box-shadow:0 6px 12px -8px var(--glow-a)}
:root.glow .btn.primary{box-shadow:0 0 12px var(--glow-b)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-strong);background:var(--bg);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* arcs: hover or tap for details */
.arc{cursor:default;outline:none}
.arc-tip{position:absolute;left:50%;top:calc(100% + 6px);transform:translate(-50%,-6px);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.45;width:max-content;max-width:min(300px,86vw);text-align:left;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.arc-tip b{color:inherit}
.arc-tip .tip-q{opacity:.75;font-size:13px}
.arc:hover .arc-tip,.arc:focus .arc-tip,.arc:focus-within .arc-tip{opacity:1;transform:translate(-50%,0)}
.yt-stat{cursor:default}
.yt-stat:hover{border-color:var(--line)}
.yt-stat .k{align-items:center}
.yt-stat .k .icon-btn{width:28px;height:28px;font-size:13px}
/* larger type, especially on wide screens */
body{font-size:16px}
.card h3{font-size:18px}
.meta,.goal,.note,.hint,.oi .m,.idea .w,.idea .src,.stage,.d{font-size:14px}
.figure .big{font-size:34px}
.figure .of{font-size:16px}
.sec-head h2{font-size:13px}
.tab{font-size:16px}
.btn{font-size:15px}
.btn.sm{font-size:14px}
.tick{font-size:13px}
.week button{font-size:12px}
.week button .dn{font-size:15px}
.yt-stat .v{font-size:28px}
.yt-stat .k{font-size:12px}
.arc-v{font-size:clamp(28px,6vw,40px)}
.arc-k{font-size:12px}
.arc-u{font-size:15px}
.item .name{font-size:16px}
.idea .t{font-size:19px}
@media (min-width:1100px){
  body{font-size:17px}
  .title h1{font-size:46px}
  .countdown .n{font-size:46px}
  .countdown .l,.title .date{font-size:16px}
  .card{padding:20px 20px 18px;gap:14px}
  .card h3{font-size:20px}
  .kind{font-size:12px}
  .meta,.goal,.note,.hint,.oi .m,.idea .w,.idea .src,.stage,.d{font-size:15px}
  .figure .big{font-size:40px}
  .figure .of{font-size:17px}
  .sec-head h2{font-size:14px}
  .tab{font-size:17px}
  .btn{font-size:16px}
  .tick{font-size:14px;padding:4px 10px}
  .week button{font-size:13px;min-height:60px}
  .week button .dn{font-size:17px}
  .yt-stat{padding:14px 16px}
  .yt-stat .v{font-size:34px}
  .yt-stat .k{font-size:13px}
  .arc{max-width:320px}
  .arc-v{font-size:46px}
  .arc-k{font-size:13px}
  .arc-u{font-size:16px}
  .item .name{font-size:17px}
  .yt-head .who b{font-size:19px}
  .idea .t{font-size:21px}
  .oi b{font-size:18px}
}
/* Archivo for titles and big numbers; digits line up with tabular figures */
h1,.card h3,.sheet h3,.yt-head .who b,.idea .t,.lv h3,.auth h1{font-family:var(--font-display);letter-spacing:-.015em}
h1,.auth h1{font-weight:900!important;letter-spacing:-.03em}
.card h3,.sheet h3,.yt-head .who b,.idea .t{font-weight:800}
.figure .big,.arc-v,.yt-stat .v,.kv .v,.countdown .n,.big-input,.g-arc .big,.lv .big{font-family:var(--font-num);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.tick,.week button .dn,.num{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.countdown .n{font-weight:900}
/* pipeline stages: labeled blocks */
.item .name{font-weight:700}
.item .stages{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px}
.item .stages i{height:auto;min-height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px 6px;font-style:normal;background:var(--bg);border:1.5px solid var(--line-strong);color:var(--muted)}
.item .stages i span{font-size:13px;font-weight:600;line-height:1.15;text-align:center;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .stages i.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item .stages i.cur{background:color-mix(in srgb,var(--accent) 22%,var(--bg));border-color:var(--accent);color:var(--fg)}
.item .stages i.cur span{font-weight:800}
@media (min-width:1100px){.item .stages i{min-height:40px}.item .stages i span{font-size:14px}}
@media (max-width:520px){.item .stages{gap:4px}.item .stages i{padding:4px 3px;min-height:40px}.item .stages i span{font-size:11px}}
:root.glow .item .stages i.cur{box-shadow:0 0 10px var(--glow-b)}
/* optional tinted boxes */
:root.tinted .card:not(.complete),:root.tinted .add-goal{background:var(--card-bg)}
:root.tinted .item:not(.finished),:root.tinted .yt-stat:not(.complete),:root.tinted .week button:not(.done),:root.tinted .step button,:root.tinted .oi,:root.tinted .kv div{background:transparent}
:root.tinted .card{border-color:color-mix(in srgb,var(--line-strong) 70%,transparent)}
.tint-row{display:flex;align-items:center;gap:10px}
.tint-row input[type=range]{flex:1;accent-color:var(--fg)}
/* pipelines: names, chips, clickable stages, columns */
.item-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.name-btn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.name-btn:hover{text-decoration:underline;text-underline-offset:3px}
.item .name{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted);text-decoration:none;line-height:1.5}
.chip.soon{border-color:var(--accent);color:var(--accent)}
.chip.late{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.link{color:var(--fg)}
.chip.link:hover{border-color:var(--fg)}
.item .stages .stg{min-height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px 6px;background:var(--bg);border:1.5px solid var(--line-strong);color:var(--muted);cursor:pointer;font:inherit;transition:background-color .3s ease,border-color .3s ease,color .3s ease,transform .15s ease}
.item .stages .stg span{font-size:13px;font-weight:600;line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .stages .stg:not(:disabled):hover{border-color:var(--fg);color:var(--fg)}
.item .stages .stg.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item .stages .stg.cur{background:color-mix(in srgb,var(--accent) 22%,var(--bg));border-color:var(--accent);color:var(--fg)}
.item .stages .stg.cur span{font-weight:800}
.item .stages .stg:disabled{cursor:default}
:root.tinted .item .stages .stg:not(.on):not(.cur){background:transparent}
:root.glow .item .stages .stg.on{box-shadow:0 0 8px var(--glow-a),0 0 18px var(--glow-b)}
@media (min-width:1100px){.item .stages .stg{min-height:40px}.item .stages .stg span{font-size:14px}}
@media (max-width:520px){.item .stages{gap:4px}.item .stages .stg{padding:4px 3px;min-height:40px}.item .stages .stg span{font-size:11px}}
.seg.mini{gap:2px;padding:2px;border:1px solid var(--line-strong);border-radius:99px;flex-wrap:nowrap}
.seg.mini button{border:0;padding:3px 10px;font-size:12px;background:transparent}
.seg.mini button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.kanban{display:grid;grid-template-columns:repeat(var(--cols),minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:color-mix(in srgb,var(--fg) 4%,var(--bg));border:1.5px dashed transparent;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:border-color .15s ease,background-color .15s ease}
.kcol.kover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.khead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 2px 4px}
.khead b{font-family:var(--font-num);color:var(--fg)}
.kcard{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab;touch-action:none;user-select:none}
.kcard:hover{border-color:var(--fg)}
.kcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kname{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.kdragging{opacity:.35}
.kghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:grabbing}
/* up next */
.upnext-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.upnext-grid>.upnext:only-child{grid-column:1/-1}
@media (max-width:820px){.upnext-grid{grid-template-columns:1fr}}
.upnext{gap:10px}
.un-bar{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:14px 16px}
.un-k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.un-task{font-size:18px;min-width:0;flex:0 1 auto;overflow-wrap:anywhere;text-align:left}
.un-task b{color:var(--accent);font-weight:800}
.un-acts{margin-left:auto;display:flex;gap:8px}
.un-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.un-title{font-family:var(--font-display);font-size:clamp(24px,3vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.un-now{font-size:17px}
.un-now b{color:var(--accent)}
.un-idea{font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1.25}
.idea-day{border-style:dashed}
/* setup + privacy */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.legal{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:40px 80px;display:flex;flex-direction:column;gap:14px;line-height:1.6}
.legal h1{font-size:34px;margin:0}
.legal h2{font-size:19px;margin:18px 0 0}
.legal p,.legal li{margin:0}
.legal ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legal a{color:var(--fg)}
.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;padding:10px 0 0;font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
.research{display:flex;flex-direction:column;gap:36px}
.more-types{display:flex;flex-direction:column;gap:10px}
.more-types summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:4px 0;list-style:none}
.more-types summary::before{content:"+ "}
.more-types[open] summary::before{content:"− "}
.more-types[open] .types{margin-top:8px}
/* stage boxes in the pipeline editor */
.stage-list{display:flex;flex-direction:column;gap:6px}
.stage-edit{display:grid;grid-template-columns:26px minmax(0,1fr) 30px 30px 30px;gap:6px;align-items:center}
.stage-edit .n{font-family:var(--font-num);font-weight:800;color:var(--muted);text-align:center}
.field .stage-edit input,.field .blk-edit input,.field .ev-edit input{padding:7px 9px;font-size:15px;min-width:0}
/* daily schedule */
.sch-now{display:flex;flex-direction:column;gap:6px}
.sch-label{font-family:var(--font-display);font-size:clamp(24px,3vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.sch-label.free{color:var(--muted)}
.sch-time{font-size:15px;color:var(--muted)}
.sch-next{font-size:16px}
.sch-next b{color:var(--accent);font-weight:800}
.sch-list{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.sch-row{display:grid;grid-template-columns:8.5ch minmax(0,1fr);gap:10px;padding:6px 10px;border-radius:8px;align-items:baseline;transition:background-color .3s ease,opacity .3s ease}
.sch-row .t{font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sch-row .l{font-weight:600;overflow-wrap:anywhere}
.sch-row.past{opacity:.45}
.sch-row.now{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.sch-row.now .l{font-weight:800}
.card .clock{font-family:var(--font-num);font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.blk-list{display:flex;flex-direction:column}
.blk-edit{display:grid;grid-template-columns:minmax(0,1fr) 132px 10px 132px 30px;grid-template-areas:"l f d t x" "w w w w w";gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.blk-edit:first-child{padding-top:0}
.blk-edit .bl{grid-area:l}.blk-edit .bf{grid-area:f}.blk-edit .bd{grid-area:d;text-align:center;color:var(--muted)}.blk-edit .bt{grid-area:t}.blk-edit .bx{grid-area:x}.blk-edit .days{grid-area:w}
.field .blk-edit input[type=time]{padding:7px 6px;font-size:14px}
.days.mini{gap:4px}
.days.mini button{width:34px;height:28px;font-size:12px}
@media (max-width:560px){.blk-edit{grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 30px;grid-template-areas:"l l l x" "f d t ." "w w w w"}}
/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cal-nav .m{font-family:var(--font-display);font-weight:800;font-size:16px;min-width:9ch;text-align:center;white-space:nowrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{min-height:96px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--bg);text-align:left;font:inherit;color:inherit;min-width:0;cursor:pointer;transition:border-color .15s ease}
.cal-day:hover{border-color:var(--fg)}
.cal-day.out{opacity:.38}

/* pipeline rows: separated by lines instead of nested boxes */
.items{gap:0}
.item{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0;background:transparent}
.items>.item:first-child{border-top:0;padding-top:4px}

/* calendar: soft cells instead of a wall of outlines */

/* pipeline: published list */
.pub{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}

/* ===== Glass pass: same board, new surface. Cards float as frosted glass over a soft drifting light
   that takes the board's accent color. Nothing here changes layout or behavior. ===== */
:root{
  --page:#f1f1ef;
  --glass:rgb(255 255 255 / .56); --glass-hi:rgb(255 255 255 / .84); --glass-2:rgb(255 255 255 / .8);
  --glass-line:rgb(255 255 255 / .95); --glass-edge:rgb(255 255 255 / .9);
  --soft:rgb(17 17 17 / .05); --soft-line:rgb(17 17 17 / .09);
  --lift:0 12px 32px -14px rgb(20 20 30 / .22), 0 1px 2px rgb(0 0 0 / .05);
  --amb-a:22%; --amb-b:15%; --amb-c:9%;
  --accent-grad:linear-gradient(135deg, color-mix(in srgb, var(--accent) 76%, #fff) 0%, var(--accent) 50%, color-mix(in srgb, var(--accent) 78%, #000) 100%);
  --accent-glow:color-mix(in srgb, var(--accent) 45%, transparent);
  --spring:cubic-bezier(.22,1.2,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#060606;
  --glass:rgb(255 255 255 / .045); --glass-hi:rgb(255 255 255 / .09); --glass-2:rgb(26 26 28 / .78);
  --glass-line:rgb(255 255 255 / .12); --glass-edge:rgb(255 255 255 / .1);
  --soft:rgb(255 255 255 / .07); --soft-line:rgb(255 255 255 / .11);
  --lift:0 16px 36px -16px rgb(0 0 0 / .85);
  --amb-a:30%; --amb-b:20%; --amb-c:12%}}
:root[data-theme="dark"]{
  --page:#060606;
  --glass:rgb(255 255 255 / .045); --glass-hi:rgb(255 255 255 / .09); --glass-2:rgb(26 26 28 / .78);
  --glass-line:rgb(255 255 255 / .12); --glass-edge:rgb(255 255 255 / .1);
  --soft:rgb(255 255 255 / .07); --soft-line:rgb(255 255 255 / .11);
  --lift:0 16px 36px -16px rgb(0 0 0 / .85);
  --amb-a:30%; --amb-b:20%; --amb-c:12%}

/* the light behind everything */
html{background:var(--page)}
body{background:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(40px);
  background:
    radial-gradient(40% 32% at 14% 8%, color-mix(in srgb, var(--accent) var(--amb-a), transparent), transparent 72%),
    radial-gradient(46% 36% at 94% 30%, color-mix(in srgb, var(--accent) var(--amb-b), transparent), transparent 72%),
    radial-gradient(54% 40% at 30% 104%, color-mix(in srgb, var(--accent) var(--amb-c), transparent), transparent 72%);
  animation:glassDrift 28s ease-in-out infinite alternate}
@keyframes glassDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4%,3%,0) scale(1.08)}100%{transform:translate3d(-3%,5%,0) scale(1.03)}}
.wrap{padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header and tabs */
header{border-bottom:0;padding-bottom:4px}
.countdown .n{text-shadow:0 6px 26px var(--accent-glow)}
.tabs{border-bottom:0;margin-top:-20px;align-self:flex-start;gap:2px;padding:4px;border-radius:999px;background:var(--soft);border:1px solid var(--soft-line);max-width:100%}
.tab{border-bottom:0;margin-bottom:0;border-radius:999px;padding:8px 18px;transition:color .2s ease,background-color .25s ease,box-shadow .25s ease}
.tab[aria-selected="true"]{background:var(--glass-hi);box-shadow:0 2px 10px rgb(0 0 0 / .14), inset 0 1px 0 var(--glass-edge)}
.tabs.sd-tabs{margin-top:0}

/* buttons */
.btn{background:var(--soft);border-color:var(--soft-line);padding:8px 16px;transition:transform .18s ease,border-color .2s ease,background-color .2s ease,box-shadow .25s ease}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 40%,transparent)}

.btn.primary{background:var(--accent-grad);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 22px -8px var(--accent-glow), inset 0 1px 0 rgb(255 255 255 / .25)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{background:color-mix(in srgb,var(--danger) 8%,transparent);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.sm{padding:5px 12px}
.icon-btn{background:var(--soft);border-color:var(--soft-line);border-radius:10px;color:var(--fg);transition:transform .18s ease,border-color .2s ease}
.icon-btn:active{transform:scale(.92)}
.seg button{background:var(--soft);border-color:var(--soft-line)}
.seg.mini{border-color:var(--soft-line);background:var(--soft)}

/* cards */
.card,.sec-blk,.shot-grp,.w-row,.oi{background:linear-gradient(180deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-line);
  box-shadow:var(--lift), inset 0 1px 0 var(--glass-edge);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.card{border-radius:20px}
.sec-blk,.shot-grp,.oi{border-radius:18px}
.w-row{border-radius:16px}
.card:hover,.card:focus-within{position:relative;z-index:3}
.card.complete{border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-line));
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 16%,var(--glass-hi)), color-mix(in srgb,var(--accent) 8%,var(--glass)))}
.yt-card{border-top:1px solid var(--glass-line)}
.ch-card:hover,.w-row:hover{border-color:color-mix(in srgb,var(--fg) 35%,transparent)}
:root.tinted .card:not(.complete),:root.tinted .sec-blk,:root.tinted .shot-grp,:root.tinted .w-row{background:color-mix(in srgb,var(--card-bg) 78%,transparent);border-color:var(--glass-line)}
:root.tinted .add-goal{background:transparent}
.add-goal,.empty{border-radius:20px;border-color:var(--soft-line);border-width:1.5px}
.banner,.demo-bar{border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--soft-line));
  background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 14%,transparent), color-mix(in srgb,var(--accent) 5%,transparent));color:var(--fg);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* progress, milestones, habits */
.track{background:var(--soft);border:0;height:10px}
.yt-stat .track{height:7px}
.fill{background:var(--accent-grad);box-shadow:0 0 12px -2px var(--accent-glow)}

.big-edit{border-bottom-color:var(--soft-line)}

.big-input{background:var(--soft);border-color:var(--accent)}
.step button{background:var(--soft);border-color:var(--soft-line);border-radius:12px;width:44px;height:38px;transition:transform .18s ease}
.step button:last-child{background:var(--accent-grad);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 16px -6px var(--accent-glow)}
.step button:active{transform:scale(.92)}
.tick{background:var(--soft);border-color:transparent}
.tick.hit{background:var(--accent-grad);border-color:transparent;box-shadow:0 4px 12px -4px var(--accent-glow)}
.tick.next{border-color:var(--fg);background:transparent}
.habit{background:var(--soft);border-color:var(--soft-line);border-radius:16px}
.habit .box{border-radius:50%}
.habit.done .box{background:var(--accent-grad);border-color:transparent}
.week button{background:var(--soft);border-color:transparent;border-radius:12px}
.week button.off{background:transparent;border:1px dashed var(--soft-line)}
.week button.done{background:var(--accent-grad);border-color:transparent;box-shadow:0 4px 12px -4px var(--accent-glow)}
.week button.today{border:2px solid var(--fg)}
.week button.today.done{border-color:color-mix(in srgb,var(--accent) 60%,var(--fg))}
:root.tinted .week button:not(.done):not(.off),:root.tinted .step button:first-child{background:var(--soft)}

/* pipeline, kanban, calendar, schedule */
.item,.items>.item:first-child,.pub,.pub-row,.sch-list,.cal-agenda,.blk-edit,.sheet-foot,.auth .try{border-color:var(--soft-line)}
.item .stages .stg,.item .stages i{background:var(--soft);border-color:transparent;border-radius:10px}
.item .stages .stg.on,.item .stages i.on{background:var(--accent-grad);border-color:transparent;color:var(--on-accent)}
.item .stages .stg.cur,.item .stages i.cur{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--accent);color:var(--fg)}
:root.tinted .item .stages .stg:not(.on):not(.cur){background:var(--soft)}
.chip,.pill,.pace{border-color:var(--soft-line);background:var(--soft)}
.chip.soon{border-color:var(--accent);background:transparent}
.chip.late{background:var(--danger);border-color:var(--danger)}
.pill.up,.pace.hot{background:var(--accent-grad);border-color:transparent}
.pace.low{border-color:var(--danger);background:transparent}
.kcol{background:var(--soft);border-radius:16px}
.kcol.kover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.kcard{background:var(--glass-hi);border-color:var(--glass-line);border-radius:12px;box-shadow:0 4px 14px -8px rgb(0 0 0 / .35)}
.kghost,.cal-ghost{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.cal-day,:root.tinted .cal-day{background:var(--soft);border-radius:12px}
.cal-day.out{background:transparent}
.cal-day.cal-over{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cal-ev{background:var(--soft);border-left-color:var(--soft-line)}
.cal-ev.vid,.cal-week .cal-ev.vid{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.cal-ag:hover,.ch-v:hover{background:var(--soft)}
.sch-row{border-radius:10px}
.kv div{background:var(--soft);border-color:transparent;border-radius:12px}
.bars span{background:var(--soft-line)}
.bars span.me{background:var(--accent-grad)}
.thumb,.thumb-box,.sd-mini,.chg-th{border-radius:12px}

.field input:focus,.field select:focus,.field textarea:focus,.item-edit input:focus,.item-edit select:focus,.opts select:focus,.kw input:focus,.shot select:focus,.shot .shot-desc:focus,.ttl-in:focus,.sd-notes:focus,.ch-add input:focus,.sd-wpm input:focus{

function dur(sec){ const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0"); }

  ideas.busy.scan=!cacheOnly; ideas.err.scan=null; render();

      channelTitle:state.channel.title, recentTitles:(ideas.latest?.recent||[]).map(v=>v.title) });

function findGoal(gid){ for(const s of state.sections){ const i=s.goals.findIndex(g=>g.id===gid); if(i>-1) return {sec:s,idx:i,goal:s.goals[i]}; } return null; }
function habitDates(g){
  if(!Array.isArray(g.doneDates)) g.doneDates = g.lastDone ? [g.lastDone] : [];
  return g.doneDates;
}
function liveStreak(g){
  const done=new Set(habitDates(g)), days=g.days?.length?g.days:[0,1,2,3,4,5,6];
  const d=new Date(); let n=0;
  if(!done.has(dkey(d))) d.setDate(d.getDate()-1);   // today not done yet doesn't break the streak
  for(let i=0;i<730;i++){
    if(days.includes(d.getDay())){ if(done.has(dkey(d))) n++; else break; }
    else if(done.has(dkey(d))) n++;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function toggleDate(g,k){
  const arr=habitDates(g), i=arr.indexOf(k);
  if(i>-1) arr.splice(i,1); else arr.push(k);
  arr.sort(); if(arr.length>400) arr.splice(0,arr.length-400);
  delete g.lastDone; delete g.prevDone; delete g.streak;
}

const RESETS={none:"Never", week:"Every week", month:"Every month", year:"Every year"};
const AUTO_COUNTS={"":"I'll count it myself", youtube:"Videos published on YouTube", pipeline:"Videos finished in my pipeline"};
function periodStart(reset){ const d=new Date();
  if(reset==="month") return dkey(new Date(d.getFullYear(),d.getMonth(),1));
  if(reset==="year") return `${d.getFullYear()}-01-01`;
  if(reset==="week") return dkey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay()));
  return "0000-00-00"; }
// Counters that fill themselves: uploads on your channels, or videos finished in the pipeline, since the counter's period began.
function autoCount(g){
  const start=periodStart(g.reset||"none");
  if(g.autoCount==="pipeline"){ let n=0; for(const p of pipelines()) for(const it of p.items) if(it.finishedAt && it.finishedAt>=start) n++; return n; }
  if(g.autoCount==="youtube"){ chEnsure(); const d=chData.data; if(!d) return null;
    const mine=new Set(d.channels.filter(c=>c.kind==="mine").map(c=>c.id));
    return (d.videos||[]).filter(v=>mine.has(v.channelId) && dkey(new Date(v.publishedAt))>=start).length; }
  return null;
}
function periodKey(reset, d=new Date()){
  if(reset==="month") return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  if(reset==="year") return String(d.getFullYear());
  if(reset==="week"){ const s=new Date(d); s.setDate(d.getDate()-d.getDay()); return dkey(s); }
  return null;
}
function periodEnds(reset, d=new Date()){
  if(reset==="month") return new Date(d.getFullYear(), d.getMonth()+1, 1);
  if(reset==="year") return new Date(d.getFullYear()+1, 0, 1);
  if(reset==="week"){ const s=new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate()-s.getDay()+7); return s; }
  return null;
}
function periodName(reset, key){
  if(reset==="month"){ const [y,m]=key.split("-"); return new Date(+y, +m-1, 1).toLocaleDateString(undefined,{month:"long"}); }
  if(reset==="year") return key;
  if(reset==="week") return "Last week";
  return "";
}
// Zero any counter whose week/month/year has rolled over; keep the finished period's result.
function applyResets(){
  let changed=false;
  for(const s of state.sections) for(const g of s.goals){
    if(g.type!=="bar" || !g.reset || g.reset==="none") continue;
    const k=periodKey(g.reset);
    if(!g.period){ g.period=k; changed=true; }
    else if(g.period!==k){ g.last={value:g.done||0, total:g.total, period:g.period}; g.done=0; g.period=k; changed=true; }
  }
  if(changed) persist();
}

function applyAccent(){
  const root=document.documentElement;
  if(state.theme==="light"||state.theme==="dark") root.dataset.theme=state.theme; else delete root.dataset.theme;
  root.classList.toggle("glow", !!state.glow);
  const ct=state.cardTint||DEFAULT_TINT, pct=Math.max(2,Math.min(30,+ct.strength||8));
  const base = ct.mode==="grey" ? "var(--fg)" : ct.mode==="accent" ? "var(--accent)" : (ct.mode==="custom" && /^#[0-9a-f]{6}$/i.test(ct.color||"")) ? ct.color : null;
  root.classList.toggle("tinted", !!base);
  if(base) root.style.setProperty("--card-bg", `color-mix(in srgb, ${base} ${pct}%, var(--bg))`); else root.style.removeProperty("--card-bg");
  const a = ACCENTS.find(x=>x.id===state.accent);
  const val = a ? a.value : (/^#[0-9a-f]{6}$/i.test(state.accent||"") ? state.accent : null);
  const r=document.documentElement.style;
  if(val){ r.setProperty("--accent",val); r.setProperty("--on-accent", contrastOn(val)); }
  else { r.removeProperty("--accent"); r.removeProperty("--on-accent"); }
}
function contrastOn(hex){ const n=parseInt(hex.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>165?"#111111":"#ffffff"; }

let ptLast=0;
function ptHit(x,y){ const bar=document.querySelector(".pbar"); if(!bar) return null; const r=bar.getBoundingClientRect();
  if(y<r.top-8||y>r.bottom+8||x<r.left||x>r.right) return null;
  return [...bar.querySelectorAll("button[data-v]")].find(b=>{ const q=b.getBoundingClientRect(); return x>=q.left&&x<=q.right; })||null; }
function ptDown(x,y,e){ const b=ptHit(x,y); if(!b) return; if(e.cancelable) e.preventDefault(); if(Date.now()-ptLast<350) return; ptLast=Date.now();
  const cur=tab==="ideas"?"research":ptab; if(b.dataset.v!==cur) goPtab(b.dataset.v); }
document.addEventListener("touchstart", e=>{ const t=e.touches[0]; if(t) ptDown(t.clientX,t.clientY,e); }, {passive:false, capture:true});

  app.querySelectorAll("[data-anim-w]").forEach(el=>prevW[el.dataset.animW]=el.style.width);
  const prevO={}; app.querySelectorAll("[data-anim-o]").forEach(el=>prevO[el.dataset.animO]=el.style.strokeDashoffset);
  const clean=c=>c.replace(/\b(pop|bump|card-in)\b/g,"").replace(/\s+/g," ").trim();
  app.querySelectorAll("[data-anim-c]").forEach(el=>prevC[el.dataset.animC]=clean(el.className));
  app.querySelectorAll("[data-num]").forEach(el=>prevN[el.dataset.num]=el.textContent);
  app.querySelectorAll("[data-card]").forEach(el=>prevCards.add(el.dataset.card));
  const hadBoard=prevCards.size>0;
  h+=phoneBar();
  app.innerHTML=h;
  decorateBoard(app);
  // Progress bars grow from where they were.
  const grow=[];
  app.querySelectorAll("[data-anim-w]").forEach(el=>{ const was=prevW[el.dataset.animW]; if(was!=null && was!==el.style.width){ grow.push([el,el.style.width]); el.style.transition="none"; el.style.width=was; } });
  // Arcs sweep from where they were (or from empty on first view).
  const sweep=[];
  app.querySelectorAll("[data-anim-o]").forEach(el=>{ const target=el.style.strokeDashoffset; const was=prevO[el.dataset.animO] ?? el.getAttribute("stroke-dasharray");
    if(was!==target){ sweep.push([el,target]); el.style.transition="none"; el.style.strokeDashoffset=was; } });
  if(sweep.length){ requestAnimationFrame(()=>requestAnimationFrame(()=>sweep.forEach(([el,t])=>{ el.style.transition=""; el.style.strokeDashoffset=t; }))); }
  // Colours fade from their old state; the element that changed pops.
  const swap=[];
  app.querySelectorAll("[data-anim-c]").forEach(el=>{ const was=prevC[el.dataset.animC]; if(was!=null && was!==clean(el.className)){ swap.push([el,el.className]); el.className=was; } });
  if(grow.length||swap.length){
    void app.offsetWidth;
    grow.forEach(([el,w])=>{ el.style.transition=""; el.style.width=w; });
    swap.forEach(([el,c])=>{ el.className=c; if(el.tagName==="BUTTON"||el.classList.contains("tick")) el.classList.add("pop"); });
  }
  app.querySelectorAll("[data-num]").forEach(el=>{ const was=prevN[el.dataset.num]; if(was!=null && was!==el.textContent) el.classList.add("bump"); });
  if(hadBoard) app.querySelectorAll("[data-card]").forEach(el=>{ if(!prevCards.has(el.dataset.card)) el.classList.add("card-in"); });
  if(confirmSec){ const b=document.querySelector(`[data-a="sec-del"][data-id="${confirmSec}"]`); if(b){b.textContent="Sure?";b.style.width="auto";b.style.padding="0 8px";b.style.color="var(--danger)";} }
}

function sparkline(rows){
  const pts=rows.filter(r=>r.subscribers!=null);
  if(pts.length<2) return "";
  const W=600,H=96,pad=6, vals=pts.map(r=>r.subscribers);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(hi===lo){ hi+=1; lo-=1; }
  const X=i=>pad+(i/(pts.length-1))*(W-2*pad), Y=v=>H-pad-((v-lo)/(hi-lo))*(H-2*pad);
  const line=pts.map((r,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(r.subscribers).toFixed(1)}`).join("");
  const area=`${line}L${X(pts.length-1).toFixed(1)} ${H-pad}L${X(0).toFixed(1)} ${H-pad}Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Subscribers from ${fmt(vals[0])} to ${fmt(vals[vals.length-1])}">
    <line class="grid" x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}"/><path class="area" d="${area}"/><path class="ln" d="${line}"/></svg>
    <div class="spark-meta"><span>${esc(shortDay(pts[0].day))}</span><span>${esc(shortDay(pts[pts.length-1].day))}</span></div>`;
}
function delta(field, days){
  // Compares the newest daily snapshot with the one from about \`days\` ago.
  // With less history than that, it compares with the first day the channel was tracked.
  const l=latest(); if(!l || l[field]==null) return null;
  const cut=new Date(l.day+"T00:00:00"); cut.setDate(cut.getDate()-days);
  const base=[...snaps].reverse().find(r=>new Date(r.day+"T00:00:00")<=cut && r[field]!=null) || snaps.find(r=>r[field]!=null);
  if(!base || base.day===l.day) return null;
  const full = Math.round((new Date(l.day+"T00:00:00")-new Date(base.day+"T00:00:00"))/86400000) >= days;
  return { n: l[field]-base[field], since: base.day, days, full };
}
function shortDay(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function deltaText(d){

}

function short(n){ if(n>=1e9) return +(n/1e9).toFixed(n%1e9?1:0)+"B"; if(n>=1e6) return +(n/1e6).toFixed(n%1e6?1:0)+"M"; if(n>=1e3) return +(n/1e3).toFixed(n%1e3?1:0)+"K"; return String(n); }

function ytStat(m, label, shown, value, days){

function arcSvg(frac, key){
  const L=Math.PI*80, off=(L*(1-Math.max(0,Math.min(1,frac)))).toFixed(1);
  return `<svg viewBox="0 0 200 112" aria-hidden="true">
      <path class="arc-track" d="M20 100 A80 80 0 0 1 180 100"/>
      <path class="arc-fill" d="M20 100 A80 80 0 0 1 180 100" stroke-dasharray="${L.toFixed(1)}" style="stroke-dashoffset:${off}" data-anim-o="arc-${key}"/>

function arcFor(m, value){
  const goals=ytGoals(m), name=METRICS[m].toLowerCase();
  let frac=0, under="", tip="";
  const next = value!=null ? goals.find(x=>x>value) : null;
  const reached = value!=null ? goals.filter(x=>x<=value) : [];
  if(value==null){ under="Hidden by the channel"; tip="This channel hides its subscriber count."; }
  else if(!goals.length){ under=editing?"Set a goal with ✎ below":""; tip=`${fmt(value)} ${name} now.<br>Add a goal in Edit board to fill this arc.`; }
  else if(!next){ frac=1; under=`<b>All goals reached</b>`; tip=`${fmt(value)} ${name} now.<br>Every goal reached (highest: ${fmt(goals[goals.length-1])}).`; }
  else {
    frac=Math.max(0,Math.min(1,value/next));
    under=`<b>${fmt(next-value)}</b> to ${short(next)}`;
    tip=`<b>${Math.floor(frac*100)}%</b> of the way to ${fmt(next)} ${name}<br>Now: ${fmt(value)} · To go: ${fmt(next-value)}`
      + (reached.length?`<br>Goals reached: ${reached.map(short).join(", ")}`:"")

    ${arcSvg(frac, m)}

    <div class="arc-u">${under}</div>

}
function ytSuggest(m, steps){
  if(steps.length) return nextSuggestion(steps);

function dueChip(it, fin){
  if(!it.due || fin) return "";
  const d=new Date(it.due+"T00:00:00"), t=new Date(dkey(new Date())+"T00:00:00"), n=Math.round((d-t)/86400000);
  let txt, cls="";
  if(n<0){ txt=`Overdue ${-n}d`; cls="late"; }
  else if(n===0){ txt="Due today"; cls="soon"; }
  else if(n===1){ txt="Due tomorrow"; cls="soon"; }
  else if(n<7) txt="Due "+d.toLocaleDateString(undefined,{weekday:"short"});
  else txt="Due "+d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<span class="chip ${cls}">${txt}</span>`;
}
function itemExtras(it, fin){
  const parts=[dueChip(it, fin)];
  if(it.scriptWords) parts.push(`<span class="chip">Script · ${fmt(it.scriptWords)} words</span>`);
  if(it.script) parts.push(`<a class="chip link" href="${esc(safeUrl(it.script))}" target="_blank" rel="noopener" data-stop="1">Link ↗</a>`);
  if(it.notes) parts.push(`<span class="chip">Notes</span>`);
  if(it.source?.title) parts.push(`<span class="chip src" title="${esc(it.source.title)}">From outlier</span>`);
  const h=parts.filter(Boolean).join("");
  return h?`<div class="chips">${h}</div>`:"";
}

function celebrate(g, it, prev){
  if(!it || !(it.stage>prev)) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  for(let i=prev;i<Math.min(it.stage,g.stages.length);i++){
    const b=document.querySelector(`[data-anim-c="${g.id}-${it.id}-${i}"]`);
    if(b){ b.classList.remove("just-done"); void b.offsetWidth; b.classList.add("just-done"); setTimeout(()=>b.classList.remove("just-done"),900); }
  }
  if(it.stage>=g.stages.length){
    recentFin.add(it.id); render();
    const row=document.querySelector(`.item[data-anim-c="${g.id}-${it.id}"]`) || document.querySelector(`.kcard[data-kcard="${it.id}"]`);
    if(row){ row.classList.add("celebrate"); if(!reduce) burst(row); }
    toast(`Finished: ${it.label||"Untitled"}`);
    setTimeout(()=>{ recentFin.delete(it.id); if(!sheet && !studio && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"")) render(); }, 2600);
  }
}

function burst(el){
